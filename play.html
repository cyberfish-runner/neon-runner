/* ==========================================================================
 * §7  视差背景（3 层城市剪影 + 透视网格 + 浮尘 + 雨丝）—— 全部离屏预渲染
 * ========================================================================== */
var Background = {
  layers: [],
  motes: [],
  init: function () {
    this.rebuild();
    this.motes = [];
    for (var i = 0; i < CONFIG.FX.DUST_COUNT; i++) this.motes.push(this.newMote(true));
  },
  /* 按当前主题重新烘焙视差层（切关时调用，全部一次性烘焙，运行时只 drawImage） */
  rebuild: function () {
    var T = Theme;
    var dense = T.dense ? 1.45 : 1;          // 「霓虹城区」楼更密
    var specs = [
      { f: 0.10, base: 0.80, color: T.far, win: 0.30, hMin: 90, hMax: 210, wMin: 46, wMax: 96, seed: 1337, gap: [2, 16], dense: dense },
      { f: 0.22, base: 0.88, color: T.mid, win: 0.34, hMin: 120, hMax: 300, wMin: 54, wMax: 120, seed: 90210, gap: [1, 12], dense: dense },
      { f: 0.38, base: 1.00, color: T.near, win: 0.38, hMin: 150, hMax: 380, wMin: 64, wMax: 150, seed: 4242, gap: [1, 10], dense: dense }
    ];
    this.layers = specs.map(function (s) {
      return { f: s.f, canvas: Background.bakeCity(s) };
    });
    /* 「霓虹城区」追加第 4 层：发光广告牌特写层（每帧只多 1 次 drawImage） */
    if (T.billboards) {
      this.layers.push({ f: 0.55, canvas: Background.bakeBillboards() });
    }
  },
  /* 发光广告牌特写层：大色块 + 模拟文字条 + 灯管边框，全部烘焙 */
  bakeBillboards: function () {
    var W = VW * 2, H = VH;
    var c = makeCanvas(W, H);
    var g = c.getContext('2d');
    var rng = makeRng(777001);
    var cols = [Theme.primary, Theme.secondary, Theme.accent];
    var x = 10;
    while (x < W - 40) {
      var bw = rrand(rng, 56, 150);
      var bh = rrand(rng, 34, 104);
      var by = rrand(rng, H * 0.16, H * 0.62);
      var col = cols[Math.floor(rng() * 3) % 3];
      /* 背板 */
      g.fillStyle = 'rgba(6,4,14,0.88)';
      g.fillRect(x, by, bw, bh);
      /* 外框灯管 */
      g.strokeStyle = rgba(col, 0.85);
      g.lineWidth = 2;
      g.strokeRect(x + 1, by + 1, bw - 2, bh - 2);
      GFX.drawGlow(g, col, x + bw / 2, by + bh / 2, Math.max(bw, bh) * 0.6, 0.5);
      /* 模拟文字条 */
      var lines = Math.max(2, Math.floor(bh / 22));
      for (var i = 0; i < lines; i++) {
        var lw = bw * rrand(rng, 0.35, 0.78);
        g.fillStyle = rgba(col, 0.34 + rng() * 0.3);
        g.fillRect(x + 8, by + 8 + i * (bh / lines), lw, Math.max(3, bh / lines - 8));
      }
      /* 竖向灯管 */
      if (rng() < 0.5) {
        g.fillStyle = rgba(cols[Math.floor(rng() * 3) % 3], 0.7);
        g.fillRect(x + bw + 4, by + rrand(rng, 0, bh * 0.5), 2, bh * rrand(rng, 0.4, 0.9));
      }
      x += bw + rrand(rng, 60, 190);
    }
    return c;
  },
  newMote: function (anywhere) {
    return {
      x: rand(-100, VW + 100),
      y: anywhere ? rand(0, VH) : VH + 10,
      sp: rand(6, 24), r: rand(0.6, 1.8),
      a: rand(0.05, 0.22), p: rand(0.2, 0.75), ph: rand(0, 6.28)
    };
  },
  bakeCity: function (s) {
    var W = VW * 2, H = VH;
    var c = makeCanvas(W, H);
    var g = c.getContext('2d');
    var rng = makeRng(s.seed);
    var x = -20;
    while (x < W + 20) {
      var w = rrand(rng, s.wMin, s.wMax);
      var h = rrand(rng, s.hMin, s.hMax);
      var y = H * s.base - h;
      g.fillStyle = s.color;
      g.fillRect(x, y, w, h);
      /* 楼顶霓虹天际线 */
      g.fillStyle = rgba(Theme.primary, 0.16);
      g.fillRect(x, y, w, 1);
      /* 零星亮窗 */
      var cols = Math.max(1, Math.floor(w / 12));
      var rows = Math.max(1, Math.floor(h / 14));
      var mix = Theme.windowMix;
      for (var i = 0; i < cols; i++) {
        for (var j = 0; j < rows; j++) {
          if (rng() > s.win * 0.22) continue;
          var wx = x + 5 + i * 12, wy = y + 7 + j * 14;
          if (wx + 4 > x + w - 3 || wy + 5 > y + h - 3) continue;
          var r = rng();
          g.fillStyle = r < mix ? rgba(Theme.primary, 0.5)
            : (r < mix + 0.2 ? rgba(Theme.secondary, 0.45) : rgba(PAL.YELLOW, 0.4));
          g.fillRect(wx, wy, 4, 5);
        }
      }
      /* 企业高塔：楼体上的红色警戒灯带 */
      if (Theme.billboards === false && rng() < 0.42) {
        var by2 = y + h * rrand(rng, 0.18, 0.72);
        g.fillStyle = rgba(Theme.accent, 0.45);
        g.fillRect(x + 2, by2, w - 4, 2);
        GFX.drawGlow(g, Theme.accent, x + w / 2, by2 + 1, 24, 0.30);
      }
      /* 天线 */
      if (rng() < 0.35) {
        var ax = x + w * 0.25 + rng() * w * 0.5;
        var ah = 10 + rng() * 28;
        g.strokeStyle = rgba(Theme.primary, 0.22);
        g.lineWidth = 1;
        g.beginPath(); g.moveTo(ax, y); g.lineTo(ax, y - ah); g.stroke();
        g.fillStyle = rgba(Theme.secondary, 0.85);
        g.fillRect(ax - 1, y - ah - 2, 2, 2);
      }
      x += w + rrand(rng, s.gap[0], s.gap[1]) / (s.dense || 1);
    }
    return c;
  },
  update: function (dt, camDX) {
    if (!CONFIG.FX.DUST) return;
    for (var i = 0; i < this.motes.length; i++) {
      var m = this.motes[i];
      m.ph += dt * 1.2;
      m.y -= m.sp * dt;
      m.x += Math.sin(m.ph) * 6 * dt - camDX * m.p * 0.15;
      if (m.y < -10 || m.x < -140) {
        var nm = this.newMote(false);
        m.x = nm.x; m.y = nm.y; m.sp = nm.sp; m.r = nm.r; m.a = nm.a; m.p = nm.p;
      }
      if (m.x > VW + 140) m.x -= VW + 280;
    }
  },
  draw: function (ctx, camX, camY) {
    ctx.fillStyle = PAL.BG;
    ctx.fillRect(0, 0, VW, VH);

    for (var i = 0; i < this.layers.length; i++) {
      var L = this.layers[i];
      var w = L.canvas.width;
      var oy = Math.round(-camY * L.f * 0.5);
      var ox = -((camX * L.f) % w);
      if (ox > 0) ox -= w;
      for (var x = ox; x < VW; x += w) ctx.drawImage(L.canvas, Math.round(x), oy);
    }
    this.drawGrid(ctx, camX);

    if (CONFIG.FX.DUST) {
      ctx.fillStyle = PAL.CYAN;
      for (var k = 0; k < this.motes.length; k++) {
        var m = this.motes[k];
        ctx.globalAlpha = m.a * (0.6 + 0.4 * Math.sin(m.ph));
        ctx.beginPath();
        ctx.arc(m.x, m.y, m.r, 0, 6.2832);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  },
  drawGrid: function (ctx, camX) {
    var horizon = VH * 0.60;
    var vpx = VW / 2 - ((camX * 0.06) % 260);
    ctx.save();
    ctx.strokeStyle = rgba(Theme.primary, 0.07);
    ctx.lineWidth = 1;
    for (var i = -16; i <= 16; i++) {
      ctx.beginPath();
      ctx.moveTo(vpx + i * 12, horizon);
      ctx.lineTo(vpx + i * 220, VH + 60);
      ctx.stroke();
    }
    for (var j = 0; j < 12; j++) {
      var t = j / 11;
      var y = horizon + Math.pow(t, 2.1) * (VH - horizon) * 1.3;
      ctx.globalAlpha = 0.05 + t * 0.06;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(VW, y); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }
};

/* 雨丝：轻量线段粒子，可开关 */
var Rain = {
  drops: [],
  init: function () {
    this.drops = [];
    for (var i = 0; i < CONFIG.FX.RAIN_COUNT; i++) this.drops.push(this.newDrop(true));
  },
  newDrop: function (anywhere) {
    return {
      x: rand(-220, VW + 220),
      y: anywhere ? rand(-VH, VH) : rand(-VH * 0.6, -10),
      len: rand(10, 26), sp: rand(700, 1250),
      a: rand(0.05, 0.22), skew: rand(0.18, 0.34)
    };
  },
  update: function (dt, camDX) {
    if (!CONFIG.FX.RAIN) return;
    for (var i = 0; i < this.drops.length; i++) {
      var d = this.drops[i];
      d.y += d.sp * dt;
      d.x -= (d.sp * d.skew + camDX * 0.25) * dt;
      if (d.y > VH + 30 || d.x < -240) {
        var n = this.newDrop(false);
        d.x = n.x; d.y = n.y; d.len = n.len; d.sp = n.sp; d.a = n.a; d.skew = n.skew;
      }
    }
  },
  draw: function (ctx) {
    if (!CONFIG.FX.RAIN) return;
    ctx.save();
    ctx.lineWidth = 1;
    for (var i = 0; i < this.drops.length; i++) {
      var d = this.drops[i];
      ctx.strokeStyle = rgba(Theme.rain, d.a);
      ctx.beginPath();
      /* 雨丝必须与真实速度矢量一致：update() 中雨滴是向左下移动的，
       * 所以尾迹（上端）应画在头部（下端）的右上方，视觉上才是朝左下飘落。 */
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x + d.len * d.skew, d.y - d.len);
      ctx.stroke();
    }
    ctx.restore();
  }
};

/* 后处理：扫描线 + 暗角（预烘焙，单次 drawImage） */
var PostFX = {
  scan: null, vignette: null,
  init: function () {
    this.scan = makeCanvas(VW, VH);
    var g = this.scan.getContext('2d');
    g.fillStyle = rgba('#000000', CONFIG.RENDER.SCANLINE_ALPHA);
    for (var y = 0; y < VH; y += 3) g.fillRect(0, y, VW, 1);

    this.vignette = makeCanvas(VW, VH);
    var g2 = this.vignette.getContext('2d');
    var vg = g2.createRadialGradient(VW / 2, VH / 2, VH * 0.34, VW / 2, VH / 2, VH * 0.98);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.62)');
    g2.fillStyle = vg;
    g2.fillRect(0, 0, VW, VH);
  },
  draw: function (ctx) {
    ctx.drawImage(this.vignette, 0, 0);
    ctx.drawImage(this.scan, 0, 0);
  }
};

/* ==========================================================================
 * §8  关卡：瓦片地图解析 + 静态层烘焙
 * ========================================================================== */
function Level(def) {
  this.def = def;
  this.tile = TILE;
  this.rows = def.rows.length;
  this.cols = 0;
  var i, r;
  for (i = 0; i < def.rows.length; i++) this.cols = Math.max(this.cols, def.rows[i].length);
  this.pxW = this.cols * this.tile;
  this.pxH = this.rows * this.tile;

  this.solid = new Uint8Array(this.cols * this.rows);  // 0 空 / 1 实体 / 2 单向
  this.decor = [];
  this.spawns = {
    chips: [], bots: [], drones: [], checkpoints: [], player: null, portal: null,
    grids: [], laserH: [], laserV: [], platH: [], platV: [],
    blink: [], switches: [], gateTiles: []
  };

  for (r = 0; r < this.rows; r++) {
    var line = def.rows[r];
    for (var c = 0; c < this.cols; c++) {
      var ch = c < line.length ? line.charAt(c) : ' ';
      var idx = r * this.cols + c;
      switch (ch) {
        case '#': this.solid[idx] = 1; break;
        case '=': this.solid[idx] = 2; break;
        case 'c': this.spawns.chips.push({ c: c, r: r }); break;
        case 'b': this.spawns.bots.push({ c: c, r: r }); break;
        case 'k': this.spawns.checkpoints.push({ c: c, r: r }); break;
        case 'P': this.spawns.player = { c: c, r: r }; break;
        case 'G': this.spawns.portal = { c: c, r: r }; break;
        case 'd': this.spawns.drones.push({ c: c, r: r }); break;
        case 'X': this.spawns.grids.push({ c: c, r: r }); break;
        case '-': this.spawns.laserH.push({ c: c, r: r }); break;
        case '|': this.spawns.laserV.push({ c: c, r: r }); break;
        case 'H': this.spawns.platH.push({ c: c, r: r }); break;
        case 'V': this.spawns.platV.push({ c: c, r: r }); break;
        case '%': this.spawns.blink.push({ c: c, r: r }); break;
        case 's': this.spawns.switches.push({ c: c, r: r }); break;
        case 'L': this.spawns.gateTiles.push({ c: c, r: r }); break;
        case 't': this.decor.push({ c: c, r: r, kind: 'sign' }); break;
        case 'o': this.decor.push({ c: c, r: r, kind: 'holo' }); break;
        case '~': this.decor.push({ c: c, r: r, kind: 'void' }); break;
        default: break;   // 空气或未定义字符
      }
    }
  }
  /* 把连续的 '-' / '|' 合并成一条完整的激光屏障（判定与视觉都是一个矩形） */
  this.lasers = groupLaserRuns(this.spawns.laserH, true)
    .concat(groupLaserRuns(this.spawns.laserV, false));
  /* 'L' 激光门：竖向合并成一面光墙（默认通电、踩开关后限时断电） */
  this.gates = groupLaserRuns(this.spawns.gateTiles, false);
  /* '%' 全息闪烁平台：横向合并成一块完整台面 */
  this.blinks = groupLaserRuns(this.spawns.blink, true);
  this.buildLayers();
}

/* 把散落的激光瓦片合并成连续段落 */
function groupLaserRuns(tiles, horizontal) {
  var map = {}, used = {}, runs = [], i;
  for (i = 0; i < tiles.length; i++) map[tiles[i].c + ',' + tiles[i].r] = true;
  for (i = 0; i < tiles.length; i++) {
    var t = tiles[i], key = t.c + ',' + t.r;
    if (used[key]) continue;
    if (horizontal) {
      var c0 = t.c;
      while (map[(c0 - 1) + ',' + t.r]) c0--;
      var c1 = t.c;
      while (map[(c1 + 1) + ',' + t.r]) c1++;
      for (var c = c0; c <= c1; c++) used[c + ',' + t.r] = true;
      runs.push({ c0: c0, c1: c1, r: t.r, horizontal: true });
    } else {
      var r0 = t.r;
      while (map[t.c + ',' + (r0 - 1)]) r0--;
      var r1 = t.r;
      while (map[t.c + ',' + (r1 + 1)]) r1++;
      for (var rr = r0; rr <= r1; rr++) used[t.c + ',' + rr] = true;
      runs.push({ r0: r0, r1: r1, c: t.c, horizontal: false });
    }
  }
  return runs;
}
Level.prototype.solidAt = function (c, r) {
  if (c < 0 || r < 0 || c >= this.cols || r >= this.rows) return 0;
  return this.solid[r * this.cols + c];
};
Level.prototype.isSolid = function (c, r) { return this.solidAt(c, r) === 1; };
Level.prototype.isOneWay = function (c, r) { return this.solidAt(c, r) === 2; };

/* 区域查询：def.zones 里按 c0/c1（横向关）或 r0/r1（纵向关）划分流程区域。
 * 一个瓦片格可能落在多个 zone 的范围里时，取数组里第一个命中的。 */
Level.prototype.zoneAt = function (c, r) {
  var z = this.def.zones;
  if (!z) return null;
  for (var i = 0; i < z.length; i++) {
    var q = z[i];
    if (c < (q.c0 != null ? q.c0 : -1e9) || c > (q.c1 != null ? q.c1 : 1e9)) continue;
    if (r < (q.r0 != null ? q.r0 : -1e9) || r > (q.r1 != null ? q.r1 : 1e9)) continue;
    return q;
  }
  return null;
};

/* 把静态瓦片烘焙成两张离屏图（装饰层 + 瓦片层），运行时只做 drawImage */
Level.prototype.buildLayers = function () {
  var self = this;
  this.decorCanvas = makeCanvas(this.pxW, this.pxH);
  this.tileCanvas = makeCanvas(this.pxW, this.pxH);
  var dg = this.decorCanvas.getContext('2d');
  var tg = this.tileCanvas.getContext('2d');

  this.decor.forEach(function (d) {
    var x = d.c * TILE, y = d.r * TILE;
    if (d.kind === 'void') {
      dg.fillStyle = 'rgba(8,0,10,0.92)';
      dg.fillRect(x, y, TILE, TILE);
      dg.fillStyle = rgba(PAL.DANGER, 0.045);
      dg.fillRect(x, y, TILE, TILE);
    } else if (d.kind === 'holo') {
      /* 全息投影广告牌：半透明斜切方块 + 扫描纹 */
      dg.save();
      dg.globalAlpha = 0.32;
      dg.fillStyle = rgba(Theme.accent, 0.5);
      dg.beginPath();
      dg.moveTo(x + 4, y + TILE - 4);
      dg.lineTo(x + TILE - 4, y + 6);
      dg.lineTo(x + TILE - 4, y + TILE - 10);
      dg.lineTo(x + 4, y + TILE - 14);
      dg.closePath();
      dg.fill();
      dg.strokeStyle = rgba(Theme.accent, 0.8);
      dg.lineWidth = 1;
      dg.stroke();
      dg.restore();
      GFX.drawGlow(dg, Theme.accent, x + TILE / 2, y + TILE / 2, 20, 0.28);
    } else {
      /* 霓虹招牌：竖排灯管 + 模拟文字条 */
      var pick = (d.c * 7 + d.r * 13) % 3;
      var col = pick === 0 ? Theme.primary : (pick === 1 ? Theme.secondary : Theme.accent);
      var w = 12, h = 36;
      GFX.drawGlow(dg, col, x + TILE / 2, y + TILE / 2, 22, 0.55);
      dg.strokeStyle = rgba(col, 0.85);
      dg.lineWidth = 1.4;
      dg.strokeRect(x + (TILE - w) / 2 + 0.5, y + (TILE - h) / 2 + 0.5, w, h);
      dg.fillStyle = rgba(col, 0.5);
      for (var i = 0; i < 4; i++) {
        dg.fillRect(x + (TILE - w) / 2 + 2.5, y + (TILE - h) / 2 + 4 + i * 8, w - 5, 3);
      }
    }
  });

  for (var r = 0; r < this.rows; r++) {
    for (var c = 0; c < this.cols; c++) {
      var v = this.solidAt(c, r);
      if (v === 1) this.drawSolid(tg, c, r);
      else if (v === 2) this.drawHolo(tg, c, r);
    }
  }
};
Level.prototype.drawSolid = function (g, c, r) {
  var x = c * TILE, y = r * TILE;
  var NEON = Theme.primary;
  g.fillStyle = PAL.METAL;
  g.fillRect(x, y, TILE, TILE);
  /* 内部金属纹理 */
  g.fillStyle = rgba(PAL.METAL_EDGE, 0.16);
  g.fillRect(x + 3, y + 3, TILE - 6, TILE - 6);
  g.fillStyle = rgba(PAL.METAL_HI, 0.5);
  g.fillRect(x + 5, y + TILE - 8, TILE - 10, 3);
  /* 电路点（确定性） */
  var h = ((c * 73856093) ^ (r * 19349663)) >>> 0;
  if (h % 5 === 0) {
    g.fillStyle = rgba(NEON, 0.3);
    g.fillRect(x + 6 + (h % 12), y + 8 + (h % 9), 2, 2);
  }
  /* 暴露的顶边：霓虹描边 + 辉光 */
  if (!this.isSolid(c, r - 1)) {
    g.fillStyle = rgba(NEON, 0.9);
    g.fillRect(x, y, TILE, 2);
    GFX.drawGlow(g, NEON, x + TILE / 2, y + 1, 18, 0.55);
  }
  /* 暴露的左右边：暗描边 */
  if (!this.isSolid(c - 1, r)) {
    g.fillStyle = rgba(PAL.METAL_EDGE, 0.9);
    g.fillRect(x, y, 1, TILE);
  }
  if (!this.isSolid(c + 1, r)) {
    g.fillStyle = rgba(PAL.METAL_EDGE, 0.9);
    g.fillRect(x + TILE - 1, y, 1, TILE);
  }
  if (!this.isSolid(c, r + 1)) {
    g.fillStyle = rgba(PAL.METAL_EDGE, 0.7);
    g.fillRect(x, y + TILE - 1, TILE, 1);
  }
};
Level.prototype.drawHolo = function (g, c, r) {
  var x = c * TILE, y = r * TILE;
  var NEON = Theme.accent;
  g.fillStyle = rgba(NEON, 0.13);
  g.fillRect(x, y, TILE, TILE);
  /* 全息扫描纹 */
  g.fillStyle = rgba(NEON, 0.06);
  for (var i = 4; i < TILE - 2; i += 6) g.fillRect(x + 2, y + i, TILE - 4, 2);
  /* 顶面发光条 */
  g.fillStyle = rgba(NEON, 0.92);
  g.fillRect(x, y, TILE, 2);
  GFX.drawGlow(g, NEON, x + TILE / 2, y + 1, 16, 0.45);
  /* 底面细线 */
  g.fillStyle = rgba(NEON, 0.4);
  g.fillRect(x, y + TILE - 1, TILE, 1);
  if (!this.isOneWay(c - 1, r)) {
    g.fillStyle = rgba(NEON, 0.5);
    g.fillRect(x, y, 1, TILE);
  }
  if (!this.isOneWay(c + 1, r)) {
    g.fillStyle = rgba(NEON, 0.5);
    g.fillRect(x + TILE - 1, y, 1, TILE);
  }
};
Level.prototype.draw = function (ctx, camX, camY) {
  var pad = 14;
  var sx = Math.max(0, camX - pad);
  var sy = Math.max(0, camY - pad);
  var sw = Math.min(this.pxW, camX + VW + pad) - sx;
  var sh = Math.min(this.pxH, camY + VH + pad) - sy;
  if (sw <= 0 || sh <= 0) return;
  ctx.drawImage(this.decorCanvas, sx, sy, sw, sh, sx, sy, sw, sh);
  ctx.drawImage(this.tileCanvas, sx, sy, sw, sh, sx, sy, sw, sh);
};

/* ==========================================================================
 * §9  物理：分轴 AABB 扫掠碰撞（带子步，保证冲刺也不穿墙）
 * ========================================================================== */
function isBlocked(level, c, r) {
  if (r < 0 || r >= level.rows) return false;      // 关卡上方可跳出，下方是虚空
  if (c < 0 || c >= level.cols) return true;       // 左右边界视为墙
  return level.isSolid(c, r);
}

function resolveX(e, level) {
  var r0 = Math.floor(e.y / TILE);
  var r1 = Math.floor((e.y + e.h - 1) / TILE);
  var c, r;
  if (e.vx > 0) {
    c = Math.floor((e.x + e.w - 1) / TILE);
    for (r = r0; r <= r1; r++) {
      if (isBlocked(level, c, r)) { e.x = c * TILE - e.w; e.vx = 0; e.hitWall = true; return; }
    }
  } else if (e.vx < 0) {
    c = Math.floor(e.x / TILE);
    for (r = r0; r <= r1; r++) {
      if (isBlocked(level, c, r)) { e.x = (c + 1) * TILE; e.vx = 0; e.hitWall = true; return; }
    }
  }
}

function resolveY(e, level, prevBottom, dropThrough) {
  var c0 = Math.floor(e.x / TILE);
  var c1 = Math.floor((e.x + e.w - 1) / TILE);
  var c, r;
  if (e.vy > 0) {
    r = Math.floor((e.y + e.h - 1) / TILE);
    for (c = c0; c <= c1; c++) {
      if (r >= level.rows) break;
      if (r >= 0 && isBlocked(level, c, r)) {
        e.y = r * TILE - e.h; e.vy = 0; e.onGround = true; return;
      }
      if (!dropThrough && r >= 0 && level.isOneWay(c, r) && prevBottom <= r * TILE + 1.5) {
        e.y = r * TILE - e.h; e.vy = 0; e.onGround = true; e.onOneWay = true; return;
      }
    }
  } else if (e.vy < 0) {
    r = Math.floor(e.y / TILE);
    for (c = c0; c <= c1; c++) {
      if (r >= 0 && isBlocked(level, c, r)) { e.y = (r + 1) * TILE; e.vy = 0; return; }
    }
  }
}

/* ---- 动态实体（移动平台 / 闪烁平台）碰撞：与瓦片同思路，用“上一帧边缘”判断来向。
 * p.solid === false 表示该平台当前处于失效状态（闪烁平台的 OFF 相位），完全跳过。
 * p.oneWay === true 表示单向平台：横向不阻挡，从下方可穿过。 ---- */
function resolveDynamicX(e, prevL, prevR, plats) {
  for (var i = 0; i < plats.length; i++) {
    var p = plats[i];
    if (p.solid === false || p.oneWay) continue;
    if (!aabb(e, p)) continue;
    if (e.vx > 0 && prevR <= p.x + 2) { e.x = p.x - e.w; e.vx = 0; e.hitWall = true; }
    else if (e.vx < 0 && prevL >= p.x + p.w - 2) { e.x = p.x + p.w; e.vx = 0; e.hitWall = true; }
  }
}
function resolveDynamicY(e, prevT, prevB, plats) {
  for (var i = 0; i < plats.length; i++) {
    var p = plats[i];
    if (p.solid === false) continue;
    if (!aabb(e, p)) continue;
    if (e.vy > 0 && prevB <= p.y + 3) {
      e.y = p.y - e.h; e.vy = 0; e.onGround = true; e.ride = p; return;
    }
    if (!p.oneWay && e.vy < 0 && prevT >= p.y + p.h - 3) {
      e.y = p.y + p.h; e.vy = 0; return;
    }
  }
}

/* 脚下探针：把角色吸附到 1.5px 内的可站立表面（瓦片、单向平台、移动平台）。
 * 没有它时，落地后下一帧重力会让角色先下沉 0.6px，导致 onGround 每隔一帧闪烁
 *（跑动动画抖动、落地特效误触发）。 */
function groundProbe(e, level, dropThrough, plats) {
  if (e.vy < 0) return false;                        // 上升中不吸附
  var footR = Math.floor((e.y + e.h + 1.5) / TILE);
  var c0 = Math.floor(e.x / TILE);
  var c1 = Math.floor((e.x + e.w - 1) / TILE);
  for (var c = c0; c <= c1; c++) {
    if (isBlocked(level, c, footR)) {
      e.y = footR * TILE - e.h;
      e.vy = 0;
      return true;
    }
    if (!dropThrough && level.isOneWay(c, footR)) {
      var top = footR * TILE;
      if (e.y + e.h <= top + 1.5) {
        e.y = top - e.h;
        e.vy = 0;
        e.onOneWay = true;
        return true;
      }
    }
  }
  /* 移动平台 / 闪烁平台：脚底 ±1.5px 内且水平有重叠即可站立
   *（低速平台靠这一步跟随升降；闪烁平台 OFF 相位直接跳过） */
  if (plats) {
    for (var i = 0; i < plats.length; i++) {
      var p = plats[i];
      if (p.solid === false) continue;
      if (e.x + e.w <= p.x + 1 || e.x >= p.x + p.w - 1) continue;
      var d = p.y - (e.y + e.h);
      if (d >= -1.5 && d <= 1.5) {
        e.y = p.y - e.h;
        e.vy = 0;
        e.ride = p;
        return true;
      }
    }
  }
  return false;
}

/* 位移 + 碰撞；单帧位移超过 0.45 瓦片时自动切子步。
 * plats 为可选的移动平台数组（动态实体），参与同一套分轴解算。 */
function moveAndCollide(e, dt, level, dropThrough, plats) {
  var adx = Math.abs(e.vx * dt), ady = Math.abs(e.vy * dt);
  var steps = clamp(Math.ceil(Math.max(adx, ady) / (TILE * 0.45)), 1, 8);
  var sdt = dt / steps;
  e.onGround = false;
  e.onOneWay = false;
  e.hitWall = false;
  e.ride = null;
  for (var i = 0; i < steps; i++) {
    var prevL = e.x, prevR = e.x + e.w, prevT = e.y;
    if (e.vx !== 0) {
      e.x += e.vx * sdt;
      resolveX(e, level);
      if (plats) resolveDynamicX(e, prevL, prevR, plats);
    }
    if (e.vy !== 0) {
      var pb = e.y + e.h;
      e.y += e.vy * sdt;
      resolveY(e, level, pb, dropThrough);
      if (plats) resolveDynamicY(e, prevT, pb, plats);
    }
  }
  if (groundProbe(e, level, dropThrough, plats)) e.onGround = true;
}

/* ==========================================================================
 * §10  实体
 * ========================================================================== */

/* ---------------- 玩家：赛博跑者 ---------------- */
function Player(x, y) {
  this.w = CONFIG.PLAYER.W;
  this.h = CONFIG.PLAYER.H;
  this.reset(x, y);
}
Player.prototype.reset = function (x, y) {
  this.x = x; this.y = y;
  this.prevX = x; this.prevY = y;
  this.vx = 0; this.vy = 0;
  this.onGround = false; this.onOneWay = false; this.hitWall = false;
  this.facing = 1;
  this.coyote = 0; this.jumpBuf = 0; this.cutApplied = true;
  this.dashTime = 0; this.dashCd = 0; this.airDashUsed = 0;
  this.dashDir = { x: 1, y: 0 }; this.ghostT = 0;
  this.dashJumpQueued = false;
  this.airJumps = 0;
  this.boostLock = false;
  this.invuln = 0; this.dropT = 0;
  this.holdT = 0; this.sprinting = false; this.lastIx = 0;
  this.runPhase = 0; this.animT = 0; this.landVy = 0;
};

Player.prototype.update = function (dt, world) {
  var P = CONFIG.PLAYER, D = CONFIG.DASH, PH = CONFIG.PHYS, In = Input;
  if (this.invuln > 0) this.invuln -= dt;
  if (this.dashCd > 0) this.dashCd -= dt;
  if (this.dropT > 0) this.dropT -= dt;
  this.animT += dt;

  var ix = (In.down.right ? 1 : 0) - (In.down.left ? 1 : 0);
  var iy = (In.down.down ? 1 : 0) - (In.down.up ? 1 : 0);
  if (ix !== 0) this.facing = ix;

  /* ---------- 霓虹冲刺：必须与 ← / → / ↓ 同时按才触发；单独按 Shift 完全无效 ----------
   * 两种"同时按"都接受：
   *   顺序 1  按住方向时按下 Shift
   *   顺序 2  按住 Shift 时按下方向
   * 方向上分量仍被钳掉（↑ 不参与，向上突进已移除）。 */
  var dashX = 0, dashY = 0, wantDash = false;
  if (ix !== 0 || iy > 0) {                    // iy > 0 表示按住 ↓
    dashX = ix;
    dashY = Math.max(0, iy);
    wantDash = In.pressed('dash') ||
      (In.down.dash && (In.pressed('left') || In.pressed('right') || In.pressed('down')));
  }
  if (wantDash && this.dashCd <= 0 && this.dashTime <= 0 &&
      (this.onGround || this.airDashUsed < D.AIR_LIMIT)) {
    var dx = dashX, dy = dashY;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    this.dashDir.x = dx / len;
    this.dashDir.y = dy / len;
    if (this.dashDir.x !== 0) this.facing = this.dashDir.x > 0 ? 1 : -1;
    this.dashTime = D.DURATION;
    this.dashCd = D.COOLDOWN;
    this.ghostT = 0;
    this.cutApplied = true;
    if (!this.onGround) this.airDashUsed++;
    world.fx.dashBurst(this);
    Camera.addShake(2.2);
    AudioBus.play('dash');
  }

  if (this.dashTime > 0) {
    /* 冲刺中：恒定速度、无重力，但依旧参与碰撞（不允许穿墙） */
    this.dashTime -= dt;
    this.vx = this.dashDir.x * D.SPEED;
    this.vy = this.dashDir.y * D.SPEED;
    this.ghostT -= dt;
    if (this.ghostT <= 0) {
      this.ghostT = D.GHOST_INTERVAL;
      world.spawnGhost(this);
    }
    world.fx.dashTrail(this);
    this.landVy = this.vy;
    /* 冲刺中按下的跳跃会被记住，冲刺结束立刻生效（“冲刺接跳”手感） */
    if (In.pressed('jump')) this.dashJumpQueued = true;
    moveAndCollide(this, dt, world.level, true, world.plats);
    var hitWall = (this.dashDir.x !== 0 && this.vx === 0) ||
                  (this.dashDir.y !== 0 && this.vy === 0);
    if (hitWall || this.dashTime <= 0) {
      this.dashTime = 0;
      this.vx *= D.EXIT_SPEED_KEEP;
      this.vy *= D.EXIT_SPEED_KEEP;
      if (this.dashJumpQueued) {
        this.dashJumpQueued = false;
        this.jumpBuf = P.JUMP_BUFFER;
      }
      AudioBus.play('dashEnd');
    }
    this.postMove(dt, world);
    return;
  }

  /* ---------- 水平移动（持续按住同方向自动加速跑） ---------- */
  if (ix !== 0 && ix === this.lastIx) this.holdT += dt;
  else this.holdT = 0;
  this.lastIx = ix;
  this.sprinting = ix !== 0 && this.holdT >= P.SPRINT_HOLD_TIME;
  var maxSpd = this.sprinting ? P.RUN_MAX : P.WALK_MAX;

  if (ix !== 0) {
    var turning = this.vx !== 0 && (this.vx > 0 ? 1 : -1) !== ix;
    var acc = (this.onGround ? P.ACCEL : P.AIR_ACCEL) * (turning ? P.TURN_BOOST : 1);
    this.vx = approach(this.vx, maxSpd * ix, acc * dt);
  } else {
    this.vx = approach(this.vx, 0, (this.onGround ? PH.GROUND_FRICTION : PH.AIR_FRICTION) * dt);
  }

  /* ---------- 跳跃：跳跃缓冲 + 土狼时间 + 长按更高 + 二段跳 ---------- */
  if (In.pressed('jump')) this.jumpBuf = P.JUMP_BUFFER;
  else if (this.jumpBuf > 0) this.jumpBuf -= dt;

  if (this.onGround) {
    this.coyote = P.COYOTE_TIME;
    this.airDashUsed = 0;
    this.airJumps = 0;                       // 落地即恢复二段跳
  } else if (this.coyote > 0) {
    this.coyote -= dt;
  }

  if (this.jumpBuf > 0 && this.coyote > 0) {
    if (In.down.down && this.onOneWay) {
      /* ↓ + 跳跃：从全息单向平台下穿 */
      this.dropT = 0.16;
      this.jumpBuf = 0;
      this.y += 3;
      this.onGround = false;
      AudioBus.play('uiMove');
    } else {
      this.vy = -P.JUMP_VEL;
      this.jumpBuf = 0;
      this.coyote = 0;
      this.onGround = false;
      this.cutApplied = false;
      world.fx.jumpDust(this);
      AudioBus.play('jump');
    }
  } else if (this.jumpBuf > 0 && !this.onGround && this.airJumps < P.AIR_JUMPS) {
    /* 二段跳（替代原向上突进）。固定高度：cutApplied = true（松键不截断）、
     * boostLock = true（上升期间不享受长按重力减免），
     * 使其净上升恒等于原向上突进的实测上限（171.7px），且更可预测。 */
    this.vy = -P.DOUBLE_JUMP_VEL;
    this.jumpBuf = 0;
    this.airJumps++;
    this.cutApplied = true;
    this.boostLock = true;
    world.fx.doubleJump(this);
    Camera.addShake(1.5);
    AudioBus.play('jump', { double: true });
  }
  if (this.vy >= 0) this.boostLock = false;          // 过了顶点就解锁（不影响后续）
  if (In.down.jump && this.vy < 0 && !this.boostLock) this.vy -= P.JUMP_HOLD_BOOST * dt;
  if (!In.down.jump && this.vy < 0 && !this.cutApplied) {
    this.vy *= P.JUMP_CUT;
    this.cutApplied = true;
  }

  /* ---------- 重力 ---------- */
  var g = PH.GRAVITY;
  if (In.down.down && this.vy > 0) g *= PH.FAST_FALL_MULT;
  this.vy += g * dt;
  var maxFall = PH.MAX_FALL * (In.down.down ? PH.FAST_FALL_MULT : 1);
  if (this.vy > maxFall) this.vy = maxFall;

  /* ---------- 位移与碰撞 ---------- */
  var wasGround = this.onGround;
  this.landVy = this.vy;
  moveAndCollide(this, dt, world.level, this.dropT > 0, world.plats);
  this.wasGround = wasGround;
  this.postMove(dt, world);
};

Player.prototype.postMove = function (dt, world) {
  if (!this.wasGround && this.onGround) {
    var power = clamp(this.landVy / 900, 0, 1);
    if (power > 0.32) {
      world.fx.landDust(this, power);
      Camera.addShake(power * 2.2);
    }
    AudioBus.play('land', { power: power });
  }
  this.wasGround = this.onGround;
  if (this.onGround && Math.abs(this.vx) > 12) {
    this.runPhase += dt * (4 + Math.abs(this.vx) * 0.055);
  } else {
    this.runPhase += dt * 2;
  }
};

Player.prototype.draw = function (ctx) {
  var blink = this.invuln > 0 && Math.floor(this.invuln * 18) % 2 === 0;
  if (blink) return;
  var x = this.x, y = this.y, w = this.w, h = this.h;
  var cx = w / 2;
  var dashing = this.dashTime > 0;
  var ready = this.dashCd <= 0;
  var pulse = 0.5 + 0.5 * Math.sin(this.animT * 6);

  /* 脚下 / 身体辉光：冲刺就绪时更亮 */
  GFX.drawGlow(ctx, PAL.CYAN, x + cx, y + h * 0.55, 26, (dashing ? 0.9 : (ready ? 0.45 : 0.18)));
  if (dashing) GFX.drawGlow(ctx, PAL.MAGENTA, x + cx - this.dashDir.x * 12, y + h * 0.5, 20, 0.5);

  ctx.save();
  ctx.translate(x, y);

  var f = this.facing;
  var run = this.onGround ? Math.sin(this.runPhase) : 0;
  var legA = this.onGround ? run * 5 : 3;
  var legB = this.onGround ? -run * 5 : -3;
  var lift = this.onGround ? 0 : 1.5;

  /* 腿 */
  ctx.strokeStyle = rgba(PAL.PLAYER_LINE, 0.8);
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx, 20 + lift);
  ctx.lineTo(cx + legA, 29);
  ctx.moveTo(cx, 20 + lift);
  ctx.lineTo(cx + legB, 29);
  ctx.stroke();

  /* 躯干 */
  ctx.fillStyle = PAL.PLAYER_BODY;
  roundRectPath(ctx, cx - 5, 9, 10, 12, 3);
  ctx.fill();
  ctx.strokeStyle = PAL.PLAYER_LINE;
  ctx.lineWidth = 1.6;
  ctx.stroke();

  /* 胸核（冲刺就绪 = 青，冷却中 = 紫暗） */
  ctx.fillStyle = ready ? PAL.CYAN : PAL.PURPLE;
  ctx.globalAlpha = ready ? 0.95 : (0.35 + 0.35 * pulse);
  ctx.fillRect(cx - 1.5, 13, 3, 4);
  ctx.globalAlpha = 1;

  /* 头 */
  ctx.fillStyle = PAL.PLAYER_BODY;
  roundRectPath(ctx, cx - 4.5, 0, 9, 8, 3);
  ctx.fill();
  ctx.strokeStyle = PAL.PLAYER_LINE;
  ctx.lineWidth = 1.6;
  ctx.stroke();

  /* 护目镜（朝向侧）+ 朝向光刃 */
  ctx.fillStyle = PAL.VISOR;
  ctx.fillRect(cx + (f > 0 ? 0.5 : -3.5), 2.5, 3, 2.5);
  GFX.drawGlow(ctx, PAL.VISOR, cx + f * 2, 3.5, 8, 0.4);
  ctx.strokeStyle = rgba(PAL.CYAN, 0.45 + 0.4 * pulse);
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(cx + f * 5, 12);
  ctx.lineTo(cx + f * 12, 10);
  ctx.stroke();

  /* 手臂 */
  ctx.strokeStyle = rgba(PAL.PLAYER_LINE, 0.75);
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx, 12);
  ctx.lineTo(cx - f * (2 + (this.onGround ? run * 3 : 4)), 19);
  ctx.stroke();

  ctx.restore();
};

/* ---------------- 冲刺残影 ---------------- */
function Ghost(p) {
  this.x = p.x; this.y = p.y;
  this.w = p.w; this.h = p.h;
  this.f = p.facing;
  this.life = CONFIG.DASH.GHOST_LIFE;
  this.max = this.life;
}
Ghost.prototype.draw = function (ctx) {
  var a = this.life / this.max;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = a * 0.5;
  ctx.fillStyle = PAL.CYAN;
  roundRectPath(ctx, this.x + 2, this.y + 2, this.w - 4, this.h - 4, 5);
  ctx.fill();
  ctx.globalAlpha = a * 0.35;
  ctx.fillStyle = PAL.PURPLE;
  roundRectPath(ctx, this.x + 5, this.y + 8, this.w - 10, this.h - 12, 4);
  ctx.fill();
  ctx.restore();
};

/* ---------------- 数据芯片 ---------------- */
function Chip(c, r) {
  var s = CONFIG.CHIP.SIZE;
  this.w = s; this.h = s;
  this.x = c * TILE + (TILE - s) / 2;
  this.baseY = r * TILE + (TILE - s) / 2;
  this.y = this.baseY;
  this.phase = rand(0, 6.28);
  this.taken = false;
}
Chip.prototype.update = function (dt) {
  this.phase += dt * 3.2;
  this.y = this.baseY + Math.sin(this.phase) * 3;
};
Chip.prototype.draw = function (ctx) {
  if (this.taken) return;
  var cx = this.x + this.w / 2, cy = this.y + this.h / 2;
  var sx = Math.abs(Math.cos(this.phase)) * 0.75 + 0.25;
  GFX.drawGlow(ctx, PAL.CYAN, cx, cy, 14, 0.5);
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(sx, 1);
  ctx.rotate(Math.PI / 4);
  var s = this.w * 0.62;
  ctx.fillStyle = rgba(PAL.CYAN, 0.9);
  ctx.fillRect(-s / 2, -s / 2, s, s);
  ctx.fillStyle = rgba('#eaffff', 0.9);
  ctx.fillRect(-s / 4, -s / 4, s / 2, s / 2);
  ctx.restore();
};

/* ---------------- 检查点：霓虹充能柱 ---------------- */
function Checkpoint(c, r) {
  this.w = 18;
  this.h = 46;
  this.x = c * TILE + (TILE - this.w) / 2;
  this.y = (r + 1) * TILE - this.h;
  this.active = false;
  this.phase = rand(0, 6.28);
}
Checkpoint.prototype.rect = function () {
  return { x: this.x - 9, y: this.y - 6, w: this.w + 18, h: this.h + 6 };
};
Checkpoint.prototype.update = function (dt, world) {
  this.phase += dt * (this.active ? 4 : 1.5);
  if (this.active && Math.random() < dt * 14) {
    world.fx.spawn({
      x: this.x + this.w / 2 + rand(-8, 8),
      y: this.y + rand(0, this.h),
      vx: rand(-8, 8), vy: rand(-46, -16),
      life: rand(0.4, 0.95), size: rand(1.5, 3),
      color: PAL.CYAN, kind: 'spark', drag: 1.4
    });
  }
};
Checkpoint.prototype.activate = function (world) {
  if (this.active) return;
  this.active = true;
  world.fx.checkpointBurst(this);
  Camera.addShake(1.8);
  AudioBus.play('checkpoint');
};
Checkpoint.prototype.draw = function (ctx) {
  var cx = this.x + this.w / 2, base = this.y + this.h;
  var col = this.active ? PAL.CYAN : '#3a1f5e';
  var pulse = 0.5 + 0.5 * Math.sin(this.phase);

  if (this.active) {
    /* 竖直光柱 */
    ctx.save();
    ctx.globalAlpha = 0.10 + 0.06 * pulse;
    ctx.fillStyle = PAL.CYAN;
    ctx.fillRect(cx - 9, this.y - 150, 18, 150);
    ctx.restore();
    GFX.drawGlow(ctx, PAL.CYAN, cx, this.y + 8, 34, 0.8);
  }
  /* 底座 */
  ctx.fillStyle = PAL.METAL;
  roundRectPath(ctx, this.x - 5, base - 8, this.w + 10, 8, 2);
  ctx.fill();
  ctx.strokeStyle = rgba(col, 0.85);
  ctx.lineWidth = 1.4;
  ctx.stroke();
  /* 柱体 */
  ctx.fillStyle = rgba(col, this.active ? 0.55 : 0.25);
  ctx.fillRect(cx - 5, this.y + 12, 10, this.h - 20);
  ctx.strokeStyle = rgba(col, 0.9);
  ctx.strokeRect(cx - 5.5, this.y + 11.5, 11, this.h - 19);
  /* 顶端充能球 */
  ctx.fillStyle = this.active ? rgba(PAL.CYAN, 0.95) : rgba(col, 0.5);
  ctx.beginPath();
  ctx.arc(cx, this.y + 8, 5 + (this.active ? pulse * 1.6 : 0), 0, 6.2832);
  ctx.fill();
  if (this.active) {
    ctx.strokeStyle = rgba('#eaffff', 0.9);
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.arc(cx, this.y + 8, 8 + pulse * 3, 0, 6.2832);
    ctx.stroke();
  }
};

/* ---------------- 终点：传送门 ---------------- */
function Portal(c, r) {
  this.w = 40;
  this.h = 56;
  this.x = c * TILE + (TILE - this.w) / 2;
  this.y = (r + 1) * TILE - this.h;
  this.phase = 0;
}
Portal.prototype.rect = function () {
  return { x: this.x, y: this.y, w: this.w, h: this.h };
};
Portal.prototype.update = function (dt, world) {
  this.phase += dt;
  if (Math.random() < dt * 24) {
    world.fx.spawn({
      x: this.x + this.w / 2 + rand(-9, 9),
      y: this.y + this.h - rand(0, 10),
      vx: rand(-10, 10), vy: rand(-70, -26),
      life: rand(0.4, 0.9), size: rand(1.5, 3),
      color: Math.random() < 0.4 ? PAL.PURPLE : PAL.CYAN,
      kind: 'spark', drag: 1.2
    });
  }
};
Portal.prototype.draw = function (ctx) {
  var cx = this.x + this.w / 2, cy = this.y + this.h / 2;
  /* 底座数据终端 */
  ctx.fillStyle = PAL.METAL;
  roundRectPath(ctx, this.x - 6, this.y + this.h - 10, this.w + 12, 10, 2);
  ctx.fill();
  ctx.strokeStyle = rgba(PAL.CYAN, 0.8);
  ctx.lineWidth = 1.4;
  ctx.stroke();

  GFX.drawGlow(ctx, PAL.CYAN, cx, cy, 52, 0.55);
  GFX.drawGlow(ctx, PAL.PURPLE, cx, cy, 40, 0.4);

  ctx.save();
  for (var i = 0; i < 3; i++) {
    var t = this.phase * (1 + i * 0.35) + i * 1.1;
    var rx = (this.w / 2) * (0.55 + 0.45 * Math.abs(Math.sin(t)));
    var ry = this.h / 2 + i * 2;
    ctx.strokeStyle = i === 0 ? rgba('#eaffff', 0.95) : (i === 1 ? rgba(PAL.CYAN, 0.85) : rgba(PAL.PURPLE, 0.7));
    ctx.lineWidth = i === 0 ? 2.4 : 1.6;
    ctx.beginPath();
    ctx.ellipse(cx, cy, Math.max(2, rx), ry, 0, 0, 6.2832);
    ctx.stroke();
  }
  ctx.restore();

  /* 中心核心 */
  ctx.fillStyle = rgba('#eaffff', 0.85);
  ctx.beginPath();
  ctx.ellipse(cx, cy, 5, 9 + Math.sin(this.phase * 4) * 1.5, 0, 0, 6.2832);
  ctx.fill();
};

/* ---------------- 安保机器人（地面巡逻） ---------------- */
function PatrolBot(c, r, override) {
  var E = CONFIG.ENEMY;
  this.homeC = c; this.homeR = r;
  this.w = E.BOT_W;
  this.h = E.BOT_H;
  this.x = c * TILE + (TILE - this.w) / 2;
  this.y = (r + 1) * TILE - this.h;
  this.dir = -1;
  this.vx = 0; this.vy = 0;
  this.onGround = false; this.onOneWay = false; this.hitWall = false;
  this.alive = true;
  this.phase = rand(0, 6.28);
  this.scan = 0;
  /* 巡逻范围限制（像素）。null = 不限，靠悬崖/撞墙掉头。
   * 关卡里必须用它把机器人挡在深坑边缘之外，否则玩家为了躲它会掉坑。 */
  this.minX = null;
  this.maxX = null;
  if (override) {
    if (override.minC != null) this.minX = override.minC * TILE;
    if (override.maxC != null) this.maxX = (override.maxC + 1) * TILE;
    if (override.dir) this.dir = override.dir;
  }
}
PatrolBot.prototype.update = function (dt, world) {
  if (!this.alive) return;
  this.phase += dt * 5;
  this.scan += dt * 1.6;
  this.vx = this.dir * CONFIG.ENEMY.BOT_SPEED;

  /* 重力 */
  this.vy += CONFIG.PHYS.GRAVITY * dt;
  if (this.vy > CONFIG.PHYS.MAX_FALL) this.vy = CONFIG.PHYS.MAX_FALL;

  moveAndCollide(this, dt, world.level, false, world.plats);
  if (this.hitWall) this.dir *= -1;

  /* 巡逻边界 */
  if (this.minX !== null && this.x < this.minX) { this.x = this.minX; this.dir = 1; }
  if (this.maxX !== null && this.x + this.w > this.maxX) { this.x = this.maxX - this.w; this.dir = -1; }

  /* 悬崖检测：前方脚下无地面就掉头 */
  if (CONFIG.ENEMY.BOT_TURN_AT_LEDGE && this.onGround) {
    var probeX = this.dir > 0 ? this.x + this.w + 2 : this.x - 2;
    var cc = Math.floor(probeX / TILE);
    var rr = Math.floor((this.y + this.h + 2) / TILE);
    if (!world.level.isSolid(cc, rr) && !world.level.isOneWay(cc, rr)) this.dir *= -1;
  }
};
PatrolBot.prototype.kill = function (world) {
  this.alive = false;
  world.fx.botBurst(this);
};
PatrolBot.prototype.draw = function (ctx) {
  if (!this.alive) return;
  var x = this.x, y = this.y, w = this.w, h = this.h;
  var cx = x + w / 2;
  /* 扫描光 */
  var sweep = Math.sin(this.scan) * 16;
  var eyeX = cx + this.dir * 4;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.20;
  ctx.fillStyle = PAL.DANGER;
  ctx.beginPath();
  ctx.moveTo(eyeX, y + 10);
  ctx.lineTo(eyeX + this.dir * 46, y + 2 + sweep);
  ctx.lineTo(eyeX + this.dir * 46, y + 24 + sweep);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  GFX.drawGlow(ctx, PAL.DANGER, eyeX, y + 10, 12, 0.5);

  /* 机体 */
  ctx.fillStyle = PAL.METAL;
  roundRectPath(ctx, x, y + 2, w, h - 6, 5);
  ctx.fill();
  ctx.strokeStyle = rgba(PAL.METAL_EDGE, 0.95);
  ctx.lineWidth = 1.4;
  ctx.stroke();
  /* 顶部霓虹条 */
  ctx.fillStyle = rgba(PAL.MAGENTA, 0.75);
  ctx.fillRect(x + 3, y + 4, w - 6, 2);
  /* 履带 */
  ctx.fillStyle = '#0a0e1c';
  roundRectPath(ctx, x + 2, y + h - 7, w - 4, 7, 3);
  ctx.fill();
  ctx.fillStyle = rgba(PAL.CYAN, 0.5);
  for (var i = 0; i < 4; i++) {
    var tx = x + 5 + ((i * 6 + (this.phase * 3) % 6) % (w - 10));
    ctx.fillRect(tx, y + h - 5, 2, 3);
  }
  /* 扫描眼 */
  ctx.fillStyle = PAL.DANGER;
  ctx.beginPath();
  ctx.arc(eyeX, y + 10, 3, 0, 6.2832);
  ctx.fill();
  ctx.fillStyle = rgba('#ffd8e0', 0.95);
  ctx.fillRect(eyeX - 1, y + 9, 2, 2);
  /* 天线 */
  ctx.strokeStyle = rgba(PAL.METAL_EDGE, 0.9);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx + 6, y + 2);
  ctx.lineTo(cx + 6, y - 6);
  ctx.stroke();
  ctx.fillStyle = rgba(PAL.DANGER, 0.6 + 0.4 * Math.sin(this.phase * 2));
  ctx.fillRect(cx + 5, y - 8, 2, 2);
};

/* ---------------- 无人机（固定航线，只能用霓虹冲刺击毁） ---------------- */
function Drone(spawn, override) {
  var D = CONFIG.DRONE;
  this.w = D.W; this.h = D.H;
  this.bx = spawn.c * TILE + TILE / 2;      // 逻辑中心
  this.by = spawn.r * TILE + TILE / 2;
  this.x = this.bx - this.w / 2;
  this.y = this.by - this.h / 2;
  this.home = { x: this.bx, y: this.by };
  this.speed = D.SPEED;
  this.path = null;
  this.wp = 0;
  this.phase = rand(0, 6.28);
  this.alive = true;
  this.facing = -1;
  /* 关卡可用 def.drones 覆写：{c,r,path:[[c,r],...],speed} */
  if (override) {
    if (override.speed) this.speed = override.speed;
    if (override.path) {
      this.path = override.path.map(function (p) {
        return { x: p[0] * TILE + TILE / 2, y: p[1] * TILE + TILE / 2 };
      });
      this.wp = 1 % this.path.length;
    }
  }
}
Drone.prototype.buildDefaultPath = function (level) {
  var span = CONFIG.DRONE.PATROL_SPAN * TILE;
  var left = clamp(this.home.x - span, this.w, level.pxW - this.w);
  var right = clamp(this.home.x + span, this.w, level.pxW - this.w);
  this.path = [{ x: left, y: this.home.y }, { x: right, y: this.home.y }];
  this.wp = 1;
};
Drone.prototype.update = function (dt, world) {
  if (!this.alive) return;
  var D = CONFIG.DRONE;
  this.phase += dt * D.HOVER_SPEED;
  if (!this.path) this.buildDefaultPath(world.level);
  var t = this.path[this.wp];
  var dx = t.x - this.bx, dy = t.y - this.by;
  var dist = Math.sqrt(dx * dx + dy * dy);
  if (dist <= D.ARRIVE) {
    this.wp = (this.wp + 1) % this.path.length;
  } else {
    var step = Math.min(dist, this.speed * dt);
    this.bx += dx / dist * step;
    this.by += dy / dist * step;
    if (Math.abs(dx) > 2) this.facing = dx > 0 ? 1 : -1;
  }
  /* 悬停浮动直接作用于真实坐标 —— 判定盒与视觉永远一致 */
  this.x = this.bx - this.w / 2;
  this.y = this.by - this.h / 2 + Math.sin(this.phase) * D.HOVER_AMP;
  if (Math.random() < dt * 4) {
    world.fx.spawn({
      x: this.x + this.w / 2 + rand(-6, 6), y: this.y + this.h,
      vx: rand(-8, 8), vy: rand(10, 30), life: rand(0.2, 0.45),
      size: rand(1, 2), color: Theme.accent, kind: 'spark', drag: 2
    });
  }
};
Drone.prototype.kill = function (world) {
  this.alive = false;
  world.fx.droneBurst(this);
};
Drone.prototype.draw = function (ctx) {
  if (!this.alive) return;
  var x = this.x, y = this.y, w = this.w, h = this.h;
  var cx = x + w / 2, cy = y + h / 2;

  /* 红色扫描光锥（纯视觉） */
  var sweep = Math.sin(this.phase * 0.8) * 18;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.18;
  ctx.fillStyle = PAL.DANGER;
  ctx.beginPath();
  ctx.moveTo(cx, cy + 4);
  var dir = this.facing;
  ctx.lineTo(cx + dir * CONFIG.DRONE.SCAN_LEN * 0.5, cy + 8 + sweep);
  ctx.lineTo(cx + dir * CONFIG.DRONE.SCAN_LEN, cy + 26 + sweep);
  ctx.lineTo(cx + dir * CONFIG.DRONE.SCAN_LEN, cy + 34 + sweep);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  GFX.drawGlow(ctx, PAL.DANGER, cx + this.facing * 8, cy + 8, 14, 0.5);

  /* 机体 */
  ctx.fillStyle = PAL.METAL;
  roundRectPath(ctx, x + 2, y + 3, w - 4, h - 7, 5);
  ctx.fill();
  ctx.strokeStyle = rgba(Theme.accent, 0.9);
  ctx.lineWidth = 1.4;
  ctx.stroke();
  /* 顶部霓虹条 */
  ctx.fillStyle = rgba(PAL.DANGER, 0.8);
  ctx.fillRect(x + 5, y + 5, w - 10, 2);
  /* 旋翼 */
  ctx.strokeStyle = rgba(Theme.primary, 0.85);
  ctx.lineWidth = 1.6;
  var rot = Math.abs(Math.sin(this.phase * 4)) * 7 + 2;
  ctx.beginPath();
  ctx.moveTo(x - 3, y + 1); ctx.lineTo(x - 3 + rot, y + 1);
  ctx.moveTo(x + w + 3, y + 1); ctx.lineTo(x + w + 3 - rot, y + 1);
  ctx.moveTo(x - 3, y + 1.5); ctx.lineTo(x - 3, y + 5);
  ctx.moveTo(x + w + 3, y + 1.5); ctx.lineTo(x + w + 3, y + 5);
  ctx.stroke();
  /* 扫描眼 */
  ctx.fillStyle = PAL.DANGER;
  ctx.beginPath();
  ctx.arc(cx + this.facing * 7, cy + 4, 2.6, 0, 6.2832);
  ctx.fill();
  ctx.fillStyle = rgba('#ffd8e0', 0.95);
  ctx.fillRect(cx + this.facing * 7 - 1, cy + 3, 2, 2);
};

/* ---------------- 通电网格（静态伤害，判定 = 整格） ---------------- */
function EGrid(c, r) {
  this.x = c * TILE; this.y = r * TILE;
  this.w = TILE; this.h = TILE;
  this.c = c; this.r = r;
  this.phase = rand(0, CONFIG.HAZARD.GRID_PERIOD);
  this.flicker = 1;
}
EGrid.prototype.rect = function () { return this; };
EGrid.prototype.update = function (dt, world) {
  var P = CONFIG.HAZARD.GRID_PERIOD;
  this.phase = (this.phase + dt) % P;
  /* 闪烁只是视觉；伤害始终存在，避免“看起来带电却不痛”的歧义 */
  this.flicker = 0.72 + 0.28 * Math.sin(this.phase / P * 6.2832 * 3);
  if (Math.random() < dt * 3) {
    world.fx.spawn({
      x: this.x + rand(3, TILE - 3), y: this.y + rand(3, TILE - 3),
      vx: rand(-30, 30), vy: rand(-40, 10),
      life: rand(0.1, 0.3), size: rand(1, 2),
      color: Math.random() < 0.5 ? PAL.DANGER : PAL.MAGENTA, kind: 'spark', drag: 4
    });
  }
};
EGrid.prototype.draw = function (ctx) {
  var a = this.flicker;
  ctx.save();
  /* 底座网格 */
  ctx.fillStyle = 'rgba(20,4,14,0.85)';
  ctx.fillRect(this.x, this.y, this.w, this.h);
  ctx.strokeStyle = rgba(PAL.DANGER, 0.35 * a);
  ctx.lineWidth = 1;
  for (var i = 1; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(this.x + i * TILE / 3, this.y + 2);
    ctx.lineTo(this.x + i * TILE / 3, this.y + this.h - 2);
    ctx.moveTo(this.x + 2, this.y + i * TILE / 3);
    ctx.lineTo(this.x + this.w - 2, this.y + i * TILE / 3);
    ctx.stroke();
  }
  /* 电弧：随机折线，闪烁感来自 flicker */
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = rgba(PAL.DANGER, 0.85 * a);
  ctx.lineWidth = 1.6;
  for (var k = 0; k < 2; k++) {
    ctx.beginPath();
    var y0 = this.y + 4 + k * (TILE - 8) * 0.6;
    ctx.moveTo(this.x + 2, y0);
    ctx.lineTo(this.x + TILE * 0.35, y0 + (k ? -5 : 5));
    ctx.lineTo(this.x + TILE * 0.65, y0 + (k ? 4 : -4));
    ctx.lineTo(this.x + this.w - 2, y0 + (k ? -3 : 3));
    ctx.stroke();
  }
  ctx.restore();
  GFX.drawGlow(ctx, PAL.DANGER, this.x + TILE / 2, this.y + TILE / 2, 22, 0.45 * a);
};

/* ---------------- 机关 A：全息闪烁平台（单向；周期性消失 / 重现） ----------------
 * 复用动态实体通道（world.plats）：solid === false 时物理层直接跳过它，
 * oneWay === true 时横向不阻挡、从下方可穿过 —— 不会出现"平台顶头把人顶死"。 */
function BlinkPlat(run, opt) {
  var B = CONFIG.BLINK;
  this.w = (run.c1 - run.c0 + 1) * TILE;
  this.h = B.H;
  this.x = run.c0 * TILE;
  this.y = run.r * TILE + TILE - B.H - B.EDGE_LIFT;
  this.oneWay = true;
  this.dx = 0; this.dy = 0;
  this.period = B.ON + B.WARN + B.OFF;
  this.t = (((opt && opt.phase) || 0) % 1) * this.period;
  this.solid = true;
  this.warn = false;
}
BlinkPlat.prototype.update = function (dt, world) {
  var B = CONFIG.BLINK;
  this.t = (this.t + dt) % this.period;
  var was = this.solid;
  this.solid = this.t < B.ON + B.WARN;
  this.warn = this.solid && this.t >= B.ON;
  if (this.solid !== was) {
    /* 消失 / 重现瞬间：沿台面撒粒子 + 轻微镜头反馈，让玩家明确感知状态切换 */
    var n = Math.max(4, Math.round(this.w / 24));
    for (var i = 0; i < n; i++) {
      world.fx.spawn({
        x: this.x + rand(0, this.w), y: this.y + rand(0, this.h),
        vx: rand(-40, 40), vy: rand(-60, -12),
        life: rand(0.2, 0.5), size: rand(1.4, 2.8),
        color: this.solid ? Theme.primary : Theme.secondary, kind: 'spark', drag: 2.2
      });
    }
    if (!this.solid) Camera.addShake(1.2);
  }
};
BlinkPlat.prototype.draw = function (ctx) {
  var x = this.x, y = this.y, w = this.w, h = this.h;
  if (this.solid) {
    var a = this.warn ? (0.45 + 0.55 * Math.abs(Math.sin(this.t * 26))) : 1;
    ctx.save();
    ctx.globalAlpha = 0.22 * a;
    ctx.fillStyle = Theme.secondary;
    ctx.fillRect(x, y, w, h);
    ctx.globalAlpha = 0.95 * a;
    ctx.fillStyle = Theme.primary;
    ctx.fillRect(x, y, w, 2);
    ctx.globalAlpha = 0.45 * a;
    ctx.fillRect(x, y + h - 1.5, w, 1.5);
    ctx.globalAlpha = 0.10 * a;
    for (var i = 4; i < w - 4; i += 12) ctx.fillRect(x + i, y + 3, 2, h - 5);
    ctx.restore();
    GFX.drawGlow(ctx, Theme.primary, x + w / 2, y + 1, Math.min(46, w / 2 + 12), 0.38 * a);
    if (this.warn) {
      /* 预警：裂缝 + 边框急闪 */
      ctx.save();
      ctx.globalAlpha = 0.9;
      ctx.strokeStyle = PAL.DANGER;
      ctx.lineWidth = 1.2;
      for (var k = 0; k < 3; k++) {
        var cx = x + w * (0.22 + k * 0.28);
        ctx.beginPath();
        ctx.moveTo(cx, y + 1);
        ctx.lineTo(cx - 3, y + h * 0.5);
        ctx.lineTo(cx + 3, y + h - 1);
        ctx.stroke();
      }
      ctx.restore();
    }
  } else {
    /* 消失中：只剩虚线轮廓 + 呼吸微光，提示"它会回来" */
    var p = 0.18 + 0.12 * Math.sin(this.t * 8);
    ctx.save();
    ctx.globalAlpha = p;
    ctx.strokeStyle = Theme.secondary;
    ctx.lineWidth = 1;
    ctx.setLineDash([5, 7]);
    ctx.strokeRect(x + 0.5, y + h / 2, w - 1, 1);
    ctx.setLineDash([]);
    ctx.strokeStyle = Theme.primary;
    ctx.globalAlpha = p * 0.8;
    ctx.beginPath();
    ctx.moveTo(x, y + 1); ctx.lineTo(x + w, y + 1);
    ctx.stroke();
    ctx.restore();
  }
};

/* ---------------- 机关 B：地面压力开关（踩一次 → 本组激光门限时断电） ---------------- */
function SwitchPlate(c, r, opt) {
  this.w = 26;
  this.h = 8;
  this.x = c * TILE + (TILE - this.w) / 2;
  this.y = (r + 1) * TILE - this.h;        // 贴地
  this.group = (opt && opt.group) || 0;
  this.pressed = false;
  this.touching = false;
  this.pulse = 0;
  this.phase = rand(0, 6.28);
}
SwitchPlate.prototype.rect = function () {
  /* 触发范围比视觉略高：跑过即触发，不需要精确踩点 */
  return { x: this.x - 2, y: this.y - 16, w: this.w + 4, h: this.h + 18 };
};
SwitchPlate.prototype.update = function (dt, world) {
  this.phase += dt * 3;
  if (this.pulse > 0) this.pulse -= dt;
};
SwitchPlate.prototype.reset = function () {
  this.pressed = false;
  this.touching = false;
  this.pulse = 0;
};
SwitchPlate.prototype.draw = function (ctx) {
  var cx = this.x + this.w / 2, top = this.y;
  var active = this.pressed;
  var col = active ? Theme.primary : Theme.accent;
  /* 底座 */
  ctx.fillStyle = PAL.METAL;
  roundRectPath(ctx, this.x - 3, top - 2, this.w + 6, this.h + 2, 2);
  ctx.fill();
  ctx.strokeStyle = rgba(col, 0.85);
  ctx.lineWidth = 1.3;
  ctx.stroke();
  /* 压板 */
  var lift = active ? 0 : 3;
  ctx.fillStyle = rgba(col, active ? 0.9 : 0.35);
  ctx.fillRect(this.x + 2, top + lift, this.w - 4, Math.max(2, this.h - lift - 1));
  /* 左右指示灯 */
  var blink = 0.5 + 0.5 * Math.sin(this.phase * 4);
  ctx.fillStyle = rgba(active ? Theme.primary : Theme.accent, active ? 0.9 : 0.35 + 0.3 * blink);
  ctx.fillRect(this.x - 1, top, 2.5, this.h);
  ctx.fillRect(this.x + this.w - 1.5, top, 2.5, this.h);
  if (active) {
    GFX.drawGlow(ctx, Theme.primary, cx, top + this.h / 2, 26, 0.5 + 0.3 * blink);
  }
};

/* ---------------- 激光屏障（周期开关；判定盒 = 视觉光束盒） ----------------
 * 同一个类也承担『激光门』：gate === true 时不再走周期，而是由 World 的
 * 开关计时器驱动（默认通电封路，踩下开关后限时断电）。 */
function Laser(run, opt) {
  var H = CONFIG.HAZARD;
  this.horizontal = !!run.horizontal;
  var THICK = (opt && opt.gate) ? CONFIG.GATE.THICK : H.LASER_THICK;
  if (this.horizontal) {
    this.x = run.c0 * TILE;
    this.y = run.r * TILE + (TILE - THICK) / 2;
    this.w = (run.c1 - run.c0 + 1) * TILE;
    this.h = THICK;
  } else {
    this.x = run.c * TILE + (TILE - THICK) / 2;
    this.y = run.r0 * TILE;
    this.w = THICK;
    this.h = (run.r1 - run.r0 + 1) * TILE;
  }
  this.gate = !!(opt && opt.gate);
  this.group = (opt && opt.group) || 0;
  this.t = rand(0, H.LASER_CYCLE);     // 相位错开，避免所有激光同时开火
  this.on = false;
  this.warn = false;
}
Laser.prototype.update = function (dt, world) {
  var H = CONFIG.HAZARD;
  var wasOn = this.on;
  if (this.gate) {
    /* 激光门：由开关计时器决定通断 */
    var left = (world.gateTimers && world.gateTimers[this.group]) || 0;
    this.gateLeft = left;
    this.on = left <= 0;
    this.warn = left > 0 && left < CONFIG.GATE.WARN;
    if (this.on && !wasOn) world.fx.laserSparks(this);
    return;
  }
  this.t = (this.t + dt) % H.LASER_CYCLE;
  var off = H.LASER_CYCLE - H.LASER_ON - H.LASER_WARN;
  this.warn = this.t >= off && this.t < off + H.LASER_WARN;
  this.on = this.t >= off + H.LASER_WARN;
  if (this.on && !wasOn) world.fx.laserSparks(this);
};
Laser.prototype.beamRect = function () { return this; };   // 判定与视觉同源
Laser.prototype.draw = function (ctx) {
  var H = CONFIG.HAZARD;
  var cx = this.x + this.w / 2, cy = this.y + this.h / 2;

  /* 两端的发射器节点 */
  ctx.fillStyle = PAL.METAL;
  if (this.horizontal) {
    ctx.fillRect(this.x - 5, cy - 8, 6, 16);
    ctx.fillRect(this.x + this.w - 1, cy - 8, 6, 16);
    ctx.strokeStyle = rgba(Theme.accent, 0.9);
    ctx.lineWidth = 1.2;
    ctx.strokeRect(this.x - 4.5, cy - 7.5, 5, 15);
    ctx.strokeRect(this.x + this.w - 0.5, cy - 7.5, 5, 15);
  } else {
    ctx.fillRect(cx - 8, this.y - 5, 16, 6);
    ctx.fillRect(cx - 8, this.y + this.h - 1, 16, 6);
    ctx.strokeStyle = rgba(Theme.accent, 0.9);
    ctx.lineWidth = 1.2;
    ctx.strokeRect(cx - 7.5, this.y - 4.5, 15, 5);
    ctx.strokeRect(cx - 7.5, this.y + this.h - 0.5, 15, 5);
  }

  if (this.on) {
    /* 通电：粗光柱，颜色与判定盒完全一致 */
    var a = 0.85;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = rgba(PAL.DANGER, a * 0.55);
    ctx.fillRect(this.x, this.y, this.w, this.h);
    ctx.fillStyle = rgba('#fff0f4', a * 0.9);
    if (this.horizontal) ctx.fillRect(this.x, cy - 1.2, this.w, 2.4);
    else ctx.fillRect(cx - 1.2, this.y, 2.4, this.h);
    ctx.restore();
    if (this.horizontal) GFX.drawGlow(ctx, PAL.DANGER, cx, cy, 30, 0.9);
    else GFX.drawGlow(ctx, PAL.DANGER, cx, cy, 30, 0.9);
  } else if (this.warn) {
    /* 预警：细虚线 + 呼吸（无害） */
    var p = 0.4 + 0.6 * Math.abs(Math.sin(this.t * 22));
    ctx.save();
    ctx.strokeStyle = rgba(PAL.MAGENTA, p);
    ctx.lineWidth = 1;
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    if (this.horizontal) { ctx.moveTo(this.x, cy); ctx.lineTo(this.x + this.w, cy); }
    else { ctx.moveTo(cx, this.y); ctx.lineTo(cx, this.y + this.h); }
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  } else {
    /* 关闭：仅剩极暗的导轨（激光门还要显示剩余安全时间） */
    ctx.save();
    ctx.strokeStyle = rgba(PAL.METAL_EDGE, 0.55);
    ctx.lineWidth = 1;
    ctx.beginPath();
    if (this.horizontal) { ctx.moveTo(this.x, cy); ctx.lineTo(this.x + this.w, cy); }
    else { ctx.moveTo(cx, this.y); ctx.lineTo(cx, this.y + this.h); }
    ctx.stroke();
    ctx.restore();
  }

  if (this.gate) {
    /* 激光门额外信息：断电剩余时间条 + 门框标识 */
    ctx.save();
    ctx.globalAlpha = 0.9;
    ctx.strokeStyle = rgba(this.on ? PAL.DANGER : Theme.primary, 0.8);
    ctx.lineWidth = 1;
    ctx.strokeRect(this.x - 1.5, this.y - 1.5, this.w + 3, this.h + 3);
    ctx.restore();
    if (!this.on && this.gateLeft != null) {
      var bw = 44, bh = 5;
      var bx = cx - bw / 2;
      /* 高门（如 LV.02 B4 的 12 格光墙）把倒计时条放在贴近地面的位置，
       * 否则会跑到门顶、被顶部 HUD 挡住看不见 */
      var by = this.horizontal ? (this.y - 14) : (this.y + this.h - 30);
      var ratio = clamp(this.gateLeft / CONFIG.GATE.HOLD, 0, 1);
      ctx.save();
      ctx.fillStyle = 'rgba(5,8,20,0.8)';
      ctx.fillRect(bx, by, bw, bh);
      ctx.strokeStyle = rgba(Theme.primary, 0.7);
      ctx.lineWidth = 1;
      ctx.strokeRect(bx + 0.5, by + 0.5, bw - 1, bh - 1);
      ctx.fillStyle = ratio < 0.3 ? PAL.DANGER : Theme.primary;
      ctx.fillRect(bx + 1, by + 1, (bw - 2) * ratio, bh - 2);
      ctx.restore();
    }
  }
};

/* ---------------- 移动平台（实体碰撞 + 承载玩家） ---------------- */
function MovingPlatform(c, r, axis, opts) {
  opts = opts || {};
  var M = CONFIG.MOVEPLAT;
  this.w = opts.w || M.W;
  this.h = opts.h || M.H;
  this.axis = axis;                                  // 'x' | 'y'
  this.cx0 = c * TILE + TILE / 2;
  this.cy0 = r * TILE + TILE / 2;
  this.range = Math.max(TILE, (opts.range != null ? opts.range : M.RANGE) * TILE);
  this.speed = opts.speed || M.SPEED;
  this.t = (opts.phase != null ? opts.phase : Math.random()) * Math.PI * 2;
  this.x = this.cx0 - this.w / 2;
  this.y = this.cy0 - this.h / 2;
  this.dx = 0; this.dy = 0;
  this.trail = 0;
}
MovingPlatform.prototype.update = function (dt, world) {
  var px = this.x, py = this.y;
  /* 角速度 = 线速度 / 振幅，保证正弦运动的最大速度恒为 speed */
  this.t += dt * (this.speed / this.range);
  var off = Math.sin(this.t) * this.range;
  if (this.axis === 'x') {
    this.x = this.cx0 - this.w / 2 + off;
    this.y = this.cy0 - this.h / 2;
  } else {
    this.y = this.cy0 - this.h / 2 + off;
    this.x = this.cx0 - this.w / 2;
  }
  this.dx = this.x - px;
  this.dy = this.y - py;
  this.trail -= dt;
  if (world && this.trail <= 0) {
    this.trail = 0.06;
    world.fx.platThrust(this);
  }
};
MovingPlatform.prototype.draw = function (ctx) {
  var x = this.x, y = this.y, w = this.w, h = this.h;
  /* 轨道指示 */
  ctx.save();
  ctx.strokeStyle = rgba(Theme.accent, 0.22);
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 6]);
  ctx.beginPath();
  if (this.axis === 'x') {
    ctx.moveTo(this.cx0 - this.range, this.cy0);
    ctx.lineTo(this.cx0 + this.range, this.cy0);
  } else {
    ctx.moveTo(this.cx0, this.cy0 - this.range);
    ctx.lineTo(this.cx0, this.cy0 + this.range);
  }
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();

  /* 台面 */
  ctx.fillStyle = PAL.METAL;
  roundRectPath(ctx, x, y, w, h, 3);
  ctx.fill();
  ctx.strokeStyle = rgba(Theme.primary, 0.95);
  ctx.lineWidth = 1.4;
  ctx.stroke();
  /* 顶面霓虹条 */
  ctx.fillStyle = rgba(Theme.primary, 0.9);
  ctx.fillRect(x + 2, y + 1, w - 4, 2);
  /* 底部灯带 */
  ctx.fillStyle = rgba(Theme.accent, 0.6);
  ctx.fillRect(x + 5, y + h - 3, w - 10, 1.6);
  /* 中央动力核 */
  var pulse = 0.5 + 0.5 * Math.sin(this.t * 4);
  ctx.fillStyle = rgba(Theme.secondary, 0.6 + 0.4 * pulse);
  ctx.fillRect(x + w / 2 - 6, y + h / 2 - 1.5, 12, 3);
  GFX.drawGlow(ctx, Theme.primary, x + w / 2, y + h / 2, 38, 0.35);
};

/* ==========================================================================
 * §11  World —— 关卡运行时
 * ========================================================================== */
function World(def) {
  this.def = def;
  this.level = new Level(def);
  this.fx = new Particles(CONFIG.FX.MAX_PARTICLES);
  this.ghosts = [];

  var i, sp;
  this.chips = this.level.spawns.chips.map(function (s) { return new Chip(s.c, s.r); });
  this.checkpoints = this.level.spawns.checkpoints.map(function (s) { return new Checkpoint(s.c, s.r); });
  this.bots = this.level.spawns.bots.map(function (s) { return new PatrolBot(s.c, s.r, null); });
  /* 机器人巡逻范围覆写：def.bots = [{c,r,minC,maxC,dir}] */
  var bOver = def.bots || [];
  for (i = 0; i < bOver.length; i++) {
    var bo = bOver[i];
    for (var m = 0; m < this.bots.length; m++) {
      var bt = this.bots[m];
      if (bt.homeC === bo.c && bt.homeR === bo.r) {
        if (bo.minC != null) bt.minX = bo.minC * TILE;
        if (bo.maxC != null) bt.maxX = (bo.maxC + 1) * TILE;
        if (bo.dir) bt.dir = bo.dir;
        break;
      }
    }
  }

  /* 无人机：先用地图上的 'd' 生成，再用 def.drones 覆写航线 / 速度 */
  this.drones = this.level.spawns.drones.map(function (s) { return new Drone(s, null); });
  var dOver = def.drones || [];
  for (i = 0; i < dOver.length; i++) {
    var o = dOver[i], hit = null;
    for (var j = 0; j < this.drones.length; j++) {
      var dr = this.drones[j];
      if (dr.home.x === o.c * TILE + TILE / 2 && dr.home.y === o.r * TILE + TILE / 2) { hit = dr; break; }
    }
    if (hit) {
      if (o.speed) hit.speed = o.speed;
      if (o.path) {
        hit.path = o.path.map(function (p) { return { x: p[0] * TILE + TILE / 2, y: p[1] * TILE + TILE / 2 }; });
        hit.wp = 1 % hit.path.length;
      }
    } else {
      this.drones.push(new Drone({ c: o.c, r: o.r }, o));
    }
  }

  /* 通电网格 */
  this.grids = this.level.spawns.grids.map(function (s) { return new EGrid(s.c, s.r); });

  /* 激光 + 激光门：地图上的连续段合并后生成。
   * 激光门与本类共用绘制与判定盒，只是开关来源换成开关计时器。 */
  var gateRuns = this.level.gates;
  var gOver = def.gates || [];
  this.gateTimers = [0, 0, 0, 0];
  this.gateHold = [CONFIG.GATE.HOLD, CONFIG.GATE.HOLD, CONFIG.GATE.HOLD, CONFIG.GATE.HOLD];
  this.lasers = this.level.lasers.map(function (run) { return new Laser(run); });
  for (i = 0; i < gateRuns.length; i++) {
    var grp = 0, hold = CONFIG.GATE.HOLD;
    for (var q = 0; q < gOver.length; q++) {
      if (gOver[q].c === gateRuns[i].c && gOver[q].r0 === gateRuns[i].r0) {
        grp = gOver[q].group || 0;
        hold = gOver[q].hold || hold;
      }
    }
    var gl = new Laser(gateRuns[i], { gate: true, group: grp });
    gl.hold = hold;
    this.gateHold[grp] = hold;
    this.lasers.push(gl);
  }

  /* 移动平台：地图 'H' / 'V' 生成，def.movePlats 可覆写参数或追加 */
  this.plats = [];
  var mk = function (s, axis) { return new MovingPlatform(s.c, s.r, axis, null); };
  this.plats = this.level.spawns.platH.map(function (s) { return mk(s, 'x'); })
    .concat(this.level.spawns.platV.map(function (s) { return mk(s, 'y'); }));
  var pOver = def.movePlats || [];
  for (i = 0; i < pOver.length; i++) {
    var po = pOver[i], found = null;
    for (var k = 0; k < this.plats.length; k++) {
      var pl = this.plats[k];
      if (Math.abs(pl.cx0 - (po.c * TILE + TILE / 2)) < 0.5 && Math.abs(pl.cy0 - (po.r * TILE + TILE / 2)) < 0.5) {
        found = pl; break;
      }
    }
    if (found) {
      if (po.range != null) found.range = Math.max(TILE, po.range * TILE);
      if (po.speed) found.speed = po.speed;
      if (po.phase != null) found.t = po.phase * Math.PI * 2;
      if (po.w) found.w = po.w;
      if (po.h) found.h = po.h;
    } else {
      this.plats.push(new MovingPlatform(po.c, po.r, po.axis || 'x', po));
    }
  }

  /* 机关 A：全息闪烁平台（并入动态实体通道，物理层用 oneWay/solid 区分语义） */
  var bOver = def.blinks || [];
  for (i = 0; i < this.level.blinks.length; i++) {
    var run0 = this.level.blinks[i], ph = 0;
    for (var b = 0; b < bOver.length; b++) {
      if (bOver[b].c === run0.c0 && bOver[b].r === run0.r) ph = bOver[b].phase || 0;
    }
    this.plats.push(new BlinkPlat(run0, { phase: ph }));
  }

  /* 机关 B：地面压力开关 */
  this.switches = this.level.spawns.switches.map(function (s) { return new SwitchPlate(s.c, s.r, null); });
  var sOver = def.switches || [];
  for (i = 0; i < sOver.length; i++) {
    for (var m2 = 0; m2 < this.switches.length; m2++) {
      var sw = this.switches[m2];
      if (sw.x === sOver[i].c * TILE + (TILE - sw.w) / 2) sw.group = sOver[i].group || 0;
    }
  }

  var pr = this.level.spawns.portal || { c: this.level.cols - 4, r: 14 };
  this.portal = new Portal(pr.c, pr.r);

  sp = this.level.spawns.player || { c: 3, r: 14 };
  this.spawnPoint = {
    x: sp.c * TILE + (TILE - CONFIG.PLAYER.W) / 2,
    y: (sp.r + 1) * TILE - CONFIG.PLAYER.H
  };
  this.player = new Player(this.spawnPoint.x, this.spawnPoint.y);

  this.respawn = { x: this.spawnPoint.x, y: this.spawnPoint.y };
  this.totalChips = this.chips.length;
  this.gotChips = 0;
  this.time = 0;
  this.lives = CONFIG.GAME.LIVES;
  this.state = 'playing';       // playing | clear | gameover
  this.flash = 0;
  this.botKills = 0;
  this.droneKills = 0;
}
World.prototype.spawnGhost = function (p) {
  if (this.ghosts.length > 14) this.ghosts.shift();
  this.ghosts.push(new Ghost(p));
};
/* 玩家当前的冲刺速度（用于判定“冲刺击毁无人机”） */
World.prototype.playerSpeed = function () {
  var p = this.player;
  return Math.sqrt(p.vx * p.vx + p.vy * p.vy);
};
World.prototype.update = function (dt) {
  var p = this.player, i;
  if (this.state !== 'playing') {
    this.fx.update(dt);
    return;
  }
  this.time += dt;

  /* 0) 开关计时器（激光门的断电剩余时间） */
  for (i = 0; i < this.gateTimers.length; i++) {
    if (this.gateTimers[i] > 0) this.gateTimers[i] = Math.max(0, this.gateTimers[i] - dt);
  }

  /* 1) 先移动平台 / 闪烁平台，并让站在上面的玩家跟随位移（承载） */
  for (i = 0; i < this.plats.length; i++) this.plats[i].update(dt, this);
  if (CONFIG.MOVEPLAT.CARRY && p.ride) {
    p.x += p.ride.dx;
    p.y += p.ride.dy;
    p.prevX += p.ride.dx;
    p.prevY += p.ride.dy;
  }

  /* 2) 玩家 / 敌人 / 危害 */
  p.prevX = p.x; p.prevY = p.y;
  p.update(dt, this);

  for (i = 0; i < this.bots.length; i++) this.bots[i].update(dt, this);
  for (i = 0; i < this.drones.length; i++) this.drones[i].update(dt, this);
  for (i = 0; i < this.grids.length; i++) this.grids[i].update(dt, this);
  for (i = 0; i < this.lasers.length; i++) this.lasers[i].update(dt, this);
  for (i = 0; i < this.switches.length; i++) this.switches[i].update(dt, this);

  for (i = this.ghosts.length - 1; i >= 0; i--) {
    this.ghosts[i].life -= dt;
    if (this.ghosts[i].life <= 0) this.ghosts.splice(i, 1);
  }
  for (i = 0; i < this.chips.length; i++) this.chips[i].update(dt);
  for (i = 0; i < this.checkpoints.length; i++) this.checkpoints[i].update(dt, this);
  this.portal.update(dt, this);

  this.resolveEnemies();
  this.resolveHazards();
  this.resolvePickupsAndTriggers();
  this.fx.update(dt);

  if (p.y > this.level.pxH + 30) this.killPlayer('fall');
  if (this.flash > 0) this.flash -= dt * 2.5;
};
World.prototype.resolveEnemies = function () {
  var p = this.player, i;
  for (i = 0; i < this.bots.length; i++) {
    var b = this.bots[i];
    if (!b.alive || this.state !== 'playing') continue;
    if (!aabb(p, b)) continue;
    var stomped = p.vy > 0 && (p.prevY + p.h) <= b.y + 10;
    if (stomped) {
      b.kill(this);
      p.vy = -CONFIG.PLAYER.STOMP_BOUNCE;
      p.cutApplied = true;
      this.botKills++;
      Camera.addShake(2.4);
      AudioBus.play('stomp');
    } else if (p.invuln <= 0) {
      this.killPlayer('hit');
      return;
    }
  }
  /* 无人机：只能用霓虹冲刺击毁；从上方踩到同样会受伤 */
  for (i = 0; i < this.drones.length; i++) {
    var d = this.drones[i];
    if (!d.alive || this.state !== 'playing') continue;
    if (!aabb(p, d)) continue;
    if (p.dashTime > 0) {
      d.kill(this);
      this.droneKills++;
      Camera.addShake(2.2);
      AudioBus.play('droneKill');
      continue;
    }
    if (p.invuln <= 0) {
      this.killPlayer('hit');
      return;
    }
  }
};
/* 环境危害：通电网格（常驻）与激光（仅通电帧）——判定盒与视觉完全同源 */
World.prototype.resolveHazards = function () {
  var p = this.player, i;
  if (this.state !== 'playing' || p.invuln > 0) return;
  for (i = 0; i < this.grids.length; i++) {
    if (aabb(p, this.grids[i])) { this.killPlayer('grid'); return; }
  }
  for (i = 0; i < this.lasers.length; i++) {
    var L = this.lasers[i];
    if (!L.on) continue;                       // 预警 / 关闭状态绝对不伤人
    if (aabb(p, L.beamRect())) { this.killPlayer('laser'); return; }
  }
};
World.prototype.resolvePickupsAndTriggers = function () {
  var p = this.player, i;
  for (i = 0; i < this.chips.length; i++) {
    var c = this.chips[i];
    if (c.taken) continue;
    if (aabb(p, c)) {
      c.taken = true;
      this.gotChips++;
      this.fx.chipBurst(c);
      Camera.addShake(0.5);
      AudioBus.play('chip');
    }
  }
  for (i = 0; i < this.checkpoints.length; i++) {
    var k = this.checkpoints[i];
    if (k.active) continue;
    if (aabb(p, k.rect())) {
      k.activate(this);
      this.respawn = { x: k.x + (k.w - p.w) / 2, y: (k.y + k.h) - p.h };
    }
  }
  /* 机关 B：压力开关 —— 踩上去（进入触发范围）即给本组激光门充值断电时间。
   * 采用“进入瞬间触发”而不是“持续踩住刷新”，否则玩家永远离不开开关。 */
  for (i = 0; i < this.switches.length; i++) {
    var sw = this.switches[i];
    if (aabb(p, sw.rect())) {
      if (!sw.touching) {
        sw.touching = true;
        sw.pressed = true;
        sw.pulse = 0.45;
        this.gateTimers[sw.group] = this.gateHold[sw.group] || CONFIG.GATE.HOLD;
        this.fx.checkpointBurst({ x: sw.x, y: sw.y - 10, w: sw.w, h: 12 });
        Camera.addShake(1.4);
        AudioBus.play('checkpoint');
      }
    } else {
      sw.touching = false;
    }
  }
  if (this.state === 'playing' && aabb(p, this.portal.rect())) {
    this.state = 'clear';
    this.fx.portalBurst(this.portal);
    Camera.addShake(3);
    AudioBus.play('portal');
    AudioBus.play('clear', { chips: this.gotChips, total: this.totalChips, time: this.time });
  }
};
World.prototype.killPlayer = function (cause) {
  if (this.state !== 'playing') return;
  this.lives--;
  this.flash = 1;
  this.fx.hurtBurst(this.player);
  Camera.addShake(cause === 'fall' ? 3 : 6);
  AudioBus.play('hurt', { cause: cause });
  if (this.lives <= 0) {
    this.state = 'gameover';
    AudioBus.play('gameOver');
    return;
  }
  this.respawnPlayer();
};
World.prototype.respawnPlayer = function () {
  this.player.reset(this.respawn.x, this.respawn.y);
  this.player.invuln = CONFIG.PLAYER.HURT_INVULN;
  this.ghosts.length = 0;
  /* 开关与计时全部复位：避免“复活时正好被关在门里”必死 */
  for (var i = 0; i < this.gateTimers.length; i++) this.gateTimers[i] = 0;
  for (var k = 0; k < this.switches.length; k++) this.switches[k].reset();
  Camera.snapTo(this.player, this.level);
};
World.prototype.reviveAtCheckpoint = function () {
  /* 游戏结束界面选择“从检查点重来”：生命重置，位置回到最近检查点 */
  this.lives = CONFIG.GAME.LIVES;
  this.state = 'playing';
  this.flash = 1;
  this.respawnPlayer();
};
World.prototype.drawWorld = function (ctx, alpha) {
  var i, p = this.player;
  this.level.draw(ctx, Camera.rx, Camera.ry);

  for (i = 0; i < this.plats.length; i++) this.plats[i].draw(ctx);
  for (i = 0; i < this.switches.length; i++) this.switches[i].draw(ctx);
  for (i = 0; i < this.ghosts.length; i++) this.ghosts[i].draw(ctx);
  for (i = 0; i < this.grids.length; i++) this.grids[i].draw(ctx);
  for (i = 0; i < this.lasers.length; i++) this.lasers[i].draw(ctx);
  for (i = 0; i < this.chips.length; i++) this.chips[i].draw(ctx);
  for (i = 0; i < this.checkpoints.length; i++) this.checkpoints[i].draw(ctx);
  this.portal.draw(ctx);

  /* 玩家带渲染插值（逻辑 60Hz，屏幕可能更快） */
  ctx.save();
  ctx.translate((p.prevX - p.x) * (1 - alpha), (p.prevY - p.y) * (1 - alpha));
  p.draw(ctx);
  ctx.restore();

  for (i = 0; i < this.bots.length; i++) this.bots[i].draw(ctx);
  for (i = 0; i < this.drones.length; i++) this.drones[i].draw(ctx);
  this.fx.draw(ctx);
};

/* ==========================================================================
 * §12  UI 基础设施：文字 / 面板 / 鼠标 / 菜单
 * ========================================================================== */
var FONT = 'ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace';

function glowText(ctx, text, x, y, color, align, size) {
  ctx.font = (size || 13) + 'px ' + FONT;
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'top';
  ctx.fillStyle = rgba(color, 0.22);
  ctx.fillText(text, x + 1, y + 1);
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}
function bigGlowText(ctx, text, x, y, size, color) {
  ctx.save();
  ctx.font = 'bold ' + size + 'px ' + FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = color;
  ctx.shadowBlur = 20;
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 0.85;
  ctx.fillStyle = '#eaffff';
  ctx.fillText(text, x, y);
  ctx.restore();
}
/* 赛博终端面板：细发光边框 + 四角装饰 */
function panelBox(ctx, alpha, x, y, w, h, color) {
  color = color || Theme.primary;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = 'rgba(5,8,20,0.88)';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = rgba(color, 0.75);
  ctx.lineWidth = 1.5;
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  ctx.strokeStyle = rgba(Theme.secondary, 0.9);
  ctx.lineWidth = 2;
  var L = 16;
  ctx.beginPath();
  ctx.moveTo(x, y + L); ctx.lineTo(x, y); ctx.lineTo(x + L, y);
  ctx.moveTo(x + w - L, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + L);
  ctx.moveTo(x + w, y + h - L); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w - L, y + h);
  ctx.moveTo(x + L, y + h); ctx.lineTo(x, y + h); ctx.lineTo(x, y + h - L);
  ctx.stroke();
  ctx.restore();
}

/* 鼠标：把 CSS 像素映射回 960×540 逻辑坐标 */
var Mouse = {
  x: -1, y: -1, down: false, clicked: false,
  init: function (canvas) {
    canvas.addEventListener('mousemove', function (e) {
      var r = canvas.getBoundingClientRect();
      if (!r.width || !r.height) return;
      Mouse.x = (e.clientX - r.left) / r.width * VW;
      Mouse.y = (e.clientY - r.top) / r.height * VH;
    });
    canvas.addEventListener('mousedown', function (e) {
      e.preventDefault();
      Mouse.down = true;
      Mouse.clicked = true;
    });
    window.addEventListener('mouseup', function () { Mouse.down = false; });
    canvas.addEventListener('mouseleave', function () { Mouse.x = -1; Mouse.y = -1; Mouse.down = false; });
  },
  consumeClick: function () {
    var c = this.clicked;
    this.clicked = false;
    return c;
  }
};

/* 通用菜单：键盘上下 + Enter/Space 确认，鼠标可悬停可点击 */
function MenuScreen() {
  this.items = [];
  this.index = 0;
  this.top = 0;
  this.iw = 320;
  this.ih = 36;
  this.gap = 12;
  this.cx = VW / 2;
}
MenuScreen.prototype.set = function (items, top) {
  this.items = items || [];
  this.index = 0;
  this.top = top || 0;
};
MenuScreen.prototype.rect = function (i) {
  return {
    x: this.cx - this.iw / 2,
    y: this.top + i * (this.ih + this.gap),
    w: this.iw,
    h: this.ih
  };
};
MenuScreen.prototype.height = function () {
  return this.items.length * (this.ih + this.gap) - this.gap;
};
MenuScreen.prototype.hit = function (mx, my) {
  if (mx < 0 || my < 0) return -1;
  for (var i = 0; i < this.items.length; i++) {
    var r = this.rect(i);
    if (mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h) return i;
  }
  return -1;
};
/* 每逻辑步调用一次；返回被选中项的 id（未选中返回 null） */
MenuScreen.prototype.update = function () {
  if (!this.items.length) return null;
  if (Input.pressed('up')) {
    this.index = (this.index - 1 + this.items.length) % this.items.length;
    AudioBus.play('uiMove');
  }
  if (Input.pressed('down')) {
    this.index = (this.index + 1) % this.items.length;
    AudioBus.play('uiMove');
  }
  var hov = this.hit(Mouse.x, Mouse.y);
  if (hov >= 0) this.index = hov;
  var confirm = Input.pressed('confirm') || Input.pressed('jump');
  if (Mouse.consumeClick()) {
    var clickIdx = this.hit(Mouse.x, Mouse.y);
    if (clickIdx >= 0) { this.index = clickIdx; confirm = true; }
  }
  if (confirm) {
    AudioBus.play('uiConfirm');
    return this.items[this.index].id;
  }
  return null;
};
MenuScreen.prototype.draw = function (ctx, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  for (var i = 0; i < this.items.length; i++) {
    var r = this.rect(i);
    var sel = (i === this.index);
    ctx.fillStyle = sel ? rgba(Theme.primary, 0.16) : 'rgba(8,12,26,0.6)';
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = sel ? Theme.primary : rgba(Theme.primary, 0.3);
    ctx.lineWidth = sel ? 1.8 : 1;
    ctx.strokeRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1);
    if (sel) {
      ctx.fillStyle = Theme.primary;
      ctx.fillRect(r.x + 8, r.y + r.h / 2 - 3, 6, 6);
    }
    ctx.globalAlpha = alpha;
    glowText(ctx, this.items[i].label, r.x + 26, r.y + 11,
      sel ? '#eaffff' : rgba(Theme.primary, 0.8), 'left', 14);
  }
  ctx.restore();
};

/* ==========================================================================
 * §13  本地存档（localStorage；不可用时自动降级为内存存档）
 * ========================================================================== */
var Save = {
  KEY: 'neonrunner.save.v1',
  available: true,
  data: { cleared: [], best: {}, lastPlayed: 0 },
  load: function () {
    try {
      var raw = window.localStorage.getItem(this.KEY);
      if (raw) {
        var o = JSON.parse(raw);
        if (o && typeof o === 'object') {
          this.data.cleared = o.cleared || [];
          this.data.best = o.best || {};
          this.data.lastPlayed = o.lastPlayed || 0;
        }
      }
    } catch (e) {
      this.available = false;
    }
  },
  flush: function () {
    try {
      window.localStorage.setItem(this.KEY, JSON.stringify(this.data));
    } catch (e) {
      this.available = false;
    }
  },
  isCleared: function (i) { return !!this.data.cleared[i]; },
  bestOf: function (i) { return this.data.best[i] || null; },
  clearedCount: function () {
    var n = 0;
    for (var i = 0; i < LEVELS.length; i++) if (this.isCleared(i)) n++;
    return n;
  },
  totalBestScore: function () {
    var s = 0;
    for (var k in this.data.best) {
      if (Object.prototype.hasOwnProperty.call(this.data.best, k)) s += this.data.best[k].score || 0;
    }
    return s;
  },
  /* 返回已解锁但尚未通关的第一关；全部通关则回到最后一关 */
  nextUncleared: function () {
    for (var i = 0; i < LEVELS.length; i++) if (!this.isCleared(i)) return i;
    return LEVELS.length - 1;
  },
  hasProgress: function () { return this.clearedCount() > 0; },
  record: function (idx, res) {
    var prev = this.data.best[idx];
    var isNew = !prev || res.score > prev.score;
    if (isNew) this.data.best[idx] = res;
    this.data.cleared[idx] = true;      // 只要通关就记为已通过
    this.data.lastPlayed = idx;
    this.flush();
    return isNew;
  },
  reset: function () {
    this.data = { cleared: [], best: {}, lastPlayed: 0 };
    this.flush();
  }
};

/* ==========================================================================
 * §14  评价与计分（阈值来自 CONFIG.RANK / CONFIG.SCORE，可随时调整）
 * ========================================================================== */
function rankOf(chipRate, timeRatio) {
  var R = CONFIG.RANK;
  if (chipRate >= R.S.chips && timeRatio <= R.S.time) return 'S';
  if (chipRate >= R.A.chips && timeRatio <= R.A.time) return 'A';
  if (chipRate >= R.B.chips && timeRatio <= R.B.time) return 'B';
  return 'C';
}
function scoreOf(world, rank) {
  var S = CONFIG.SCORE;
  return world.gotChips * S.CHIP + Math.max(0, world.lives) * S.LIFE + (S.RANK[rank] || 0);
}
var RANK_COLOR = { S: '#eaff4d', A: '#00f0ff', B: '#b026ff', C: '#ff2d95' };

/* 把一次通关计算成完整结算数据 */
function buildResult(world) {
  var chipRate = world.totalChips ? world.gotChips / world.totalChips : 1;
  var par = world.def.parTime || CONFIG.GAME.PAR_TIME;
  var timeRatio = world.time / par;
  var rank = rankOf(chipRate, timeRatio);
  return {
    rank: rank,
    score: scoreOf(world, rank),
    chips: world.gotChips,
    total: world.totalChips,
    time: world.time,
    chipRate: chipRate,
    timeRatio: timeRatio,
    botKills: world.botKills,
    droneKills: world.droneKills,
    lives: world.lives
  };
}
