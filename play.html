/* ==========================================================================

 *  v1.0 稳定版（RELEASE）
 *  三关完整流程 + 追逐/收尾全套界面（标题 / 说明 / 暂停 / 结算评价 / 结局名单）
 *  机关：霓虹冲刺（Shift+方向）/ 二段跳 / 全息闪烁平台 / 压力板·限时激光门 /
 *        横移与升降平台 / 电网 / 周期激光 / 巡逻机器人与无人机 / 检查点 / 传送门
 *
 *  纯 HTML + CSS + 原生 JavaScript（ES6+），Canvas 2D，无任何外部依赖。
 *  双击本文件即可在桌面浏览器中运行。
 *
 *  ---------------------------------------------------------------------
 *  瓦片地图字符规则（可在 LEVELS 里直接增删改；行长度不足会自动补空格）
 *  ---------------------------------------------------------------------
 *    ' ' 或 '.'   空气
 *    '#'          金属数据块：四向实体碰撞（地面 / 墙 / 悬浮平台）
 *    '='          全息单向平台：仅当自上而下落下时碰撞（按住 ↓ + 跳跃可下穿）
 *    'c'          数据芯片：收集 +100 分
 *    'b'          安保机器人：地面巡逻，可被踩杀，侧面接触受伤
 *    'P'          玩家出生点（每关唯一）
 *    'k'          检查点充能柱：经过即激活，死亡后从最近已激活的检查点复活
 *    'G'          终点传送门：进入即过关
 *    't'          霓虹招牌装饰（不参与碰撞）
 *    '~'          深坑虚空装饰（不参与碰撞；掉出关卡底部即判定坠亡）
 *
 *  预留字符（阶段三实装，现在写进地图也不会报错，只会被忽略）：
 *    'X' 通电网格   '-' / '|' 激光屏障   'H' / 'V' 移动平台   'd' 无人机   'o' 全息投影
 *
 *  ---------------------------------------------------------------------
 *  操作
 *  ---------------------------------------------------------------------
 *    A / D 或 ← / →   左右移动（持续按住同一方向 0.3s 自动进入加速跑）
 *    空格 / W / ↑     跳跃（长按跳得更高，短按小跳）
 *    空中再按跳跃     二段跳（再升约 63px；两段合计最高 ≈ 原「向上突进」的 171.7px）
 *    Shift + ← / → / ↓  霓虹冲刺：必须与方向键同时按，单独按 Shift 无效（不支持向上）
 *    ↓                快速下落；站在全息平台上时 ↓ + 跳跃 = 下穿
 *    Esc / P          暂停 / 继续
 *    R                重开本关（回到关卡开头）
 *    C                游戏结束后：从最近的检查点重来（生命重置）
 *    1 / 2 / 3        开关 雨丝 / 粒子 / 霓虹辉光（低配模式）
 *    F2               调试：显示碰撞盒
 * ========================================================================== */

(function () {

    JUMP_VEL: 640,                     // 起跳初速

    JUMP_CUT: 0.62,                    // 上升中松手的截断系数（短按小跳）

    PATROL_SPAN: 4,                    // 未指定航线时的默认左右巡逻半径（格）
    SCAN_LEN: 130, SCAN_ANGLE: 0.42,   // 红色扫描光锥（纯视觉，不参与判定）

  HAZARD: {

    LASER_CYCLE: 2.0,                  // 激光完整周期
    LASER_ON: 1.1,                     // 其中通电（有伤害）时长

    LASER_THICK: 8                     // 通电光束粗细：判定盒与视觉同源
  },
  MOVEPLAT: {
    W: 60, H: 14,                      // 移动平台尺寸（2 格 × 半格）
    SPEED: 55,                         // 移动速度
    RANGE: 4,                          // 默认行程：自起始位置向两侧各 N 格
    CARRY: true                        // 是否承载玩家
  },
  /* 机关 A：全息闪烁平台（周期性消失/重现，单向：可从下方穿上去） */
  BLINK: {

    ON: 1.6,                           // 实体（可站立）时长

  /* 机关 B：踩下开关后限时断电的激光门 */
  GATE: {

    WARN: 0.45,                        // 即将恢复通电前的预警时长（无害）

  },
  SCORE: {

  CAMERA: {
    SMOOTH: 8,                         // 跟随平滑（指数）
    LOOKAHEAD: 0.14,                   // 速度前瞻
    SHAKE_DECAY: 3.2,
    SHAKE_MAX: 7,
    LEAN: 0.018, LEAN_MAX: 6           // 高速时的轻微镜头前倾
  },
  FX: {
    MAX_PARTICLES: 420,
    RAIN_COUNT: 150,
    DUST_COUNT: 55,
    RAIN: true, DUST: true, GLOW: true // 可开关
  },
  GAME: { LIVES: 3, PAR_TIME: 90 },
  RENDER: {
    SCANLINE_ALPHA: 0.055,
    LOW_MS: 18, LOW_FRAMES: 90         // 帧时超过 18ms 连续 90 帧 → 自动降级
  }
};

/* 配色规范（赛博朋克 / 霓虹） */
var PAL = {
  BG: '#05060f',
  FAR: '#070a18', MID: '#0a0f22', NEAR: '#0d1330',
  CYAN: '#00f0ff', MAGENTA: '#ff2d95', PURPLE: '#b026ff', YELLOW: '#eaff4d',
  DANGER: '#ff3355',
  METAL: '#10142a', METAL_HI: '#1a2140', METAL_EDGE: '#2a3766',
  PLAYER_BODY: '#0b1226', PLAYER_LINE: '#00f0ff', VISOR: '#eaffff'
};

var TILE = CONFIG.VIEW.TILE;

/* --------------------------------------------------------------------------
 * 关卡主题：每关切换一套霓虹主色 + 背景色（玩家本体始终为青色，保持辨识度）
 * -------------------------------------------------------------------------- */
var THEMES = {

    primary: '#00f0ff', secondary: '#ff2d95', accent: '#b026ff',
    far: '#070a18', mid: '#0a0f22', near: '#0d1330',

    rain: '#d9b6ff', windowMix: 0.42
  },
  /* 第三关「企业高塔」：冷峻青白 + 红色警戒光 */
  corp: {

    rain: '#cfe9ff', windowMix: 0.20,
    danger: '#ff3355', billboards: false     // 塔内不做广告牌，改做警戒灯带
  }
};
var Theme = THEMES.cyan;    // 当前关卡主题（loadLevel 时切换）

/* ==========================================================================
 * §1  工具函数
 * ========================================================================== */
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function approach(v, target, delta) {
  return v < target ? Math.min(v + delta, target) : Math.max(v - delta, target);
}
function rand(a, b) { return a + Math.random() * (b - a); }
function aabb(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function rgba(hex, a) {
  var n = parseInt(hex.slice(1), 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}
function makeCanvas(w, h) {
  var c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w));
  c.height = Math.max(1, Math.ceil(h));
  return c;
}
function makeRng(seed) {                 // 确定性伪随机（背景楼群每次一致）
  var s = (seed >>> 0) || 1;
  return function () {
    s ^= s << 13; s >>>= 0;
    s ^= s >> 17;
    s ^= s << 5; s >>>= 0;
    return s / 4294967296;
  };
}
function rrand(rng, a, b) { return a + rng() * (b - a); }
function roundRectPath(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}
function fmtTime(t) {
  var m = Math.floor(t / 60), s = Math.floor(t % 60), cs = Math.floor((t % 1) * 100);
  return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s + '.' + (cs < 10 ? '0' : '') + cs;
}

/* ==========================================================================

 * ========================================================================== */
var AudioBus = {
  enabled: false,
  volume: 0.8,
  play: function (name, opts) {
    if (!this.enabled) return;
    /* TODO: 阶段五接入实际音效播放 */
  },
  stopAll: function () {}
};

/* ==========================================================================
 * §3  离屏贴图 / 霓虹辉光缓存（性能核心：循环内绝不使用 shadowBlur）
 * ========================================================================== */
var GFX = {
  _glow: {},
  glow: function (color, radius) {
    var key = color + '|' + radius;
    var c = this._glow[key];
    if (!c) {
      var d = radius * 2;
      c = makeCanvas(d, d);
      var g = c.getContext('2d');
      var grd = g.createRadialGradient(radius, radius, 0, radius, radius, radius);
      grd.addColorStop(0, rgba(color, 0.95));
      grd.addColorStop(0.35, rgba(color, 0.32));
      grd.addColorStop(1, rgba(color, 0));
      g.fillStyle = grd;
      g.fillRect(0, 0, d, d);
      this._glow[key] = c;
    }
    return c;
  },
  drawGlow: function (ctx, color, x, y, radius, alpha) {
    if (!CONFIG.FX.GLOW || alpha <= 0) return;
    var spr = this.glow(color, radius);
    ctx.save();
    ctx.globalAlpha = Math.min(1, alpha);
    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(spr, x - radius, y - radius, radius * 2, radius * 2);
    ctx.restore();
  }
};

/* ==========================================================================
 * §4  输入系统（键盘；边沿检测只在一次逻辑步内有效）
 * ========================================================================== */
var KEYMAP = {
  KeyA: 'left', ArrowLeft: 'left',
  KeyD: 'right', ArrowRight: 'right',
  KeyW: 'up', ArrowUp: 'up',
  KeyS: 'down', ArrowDown: 'down',
  Space: 'jump', KeyJ: 'jump',
  ShiftLeft: 'dash', ShiftRight: 'dash',
  Escape: 'pause', KeyP: 'pause',
  KeyR: 'restart', KeyC: 'revive', Enter: 'confirm',
  Digit1: 'fxRain', Digit2: 'fxDust', Digit3: 'fxGlow',
  F2: 'debug', F3: 'debugZone'
};

var Input = {
  down: Object.create(null),
  just: Object.create(null),
  _queue: Object.create(null),
  init: function () {
    window.addEventListener('keydown', function (e) {
      var a = KEYMAP[e.code];
      if (!a) return;
      e.preventDefault();
      if (!e.repeat && !Input.down[a]) Input._queue[a] = true;
      Input.down[a] = true;
    }, { passive: false });
    window.addEventListener('keyup', function (e) {
      var a = KEYMAP[e.code];
      if (!a) return;
      e.preventDefault();
      Input.down[a] = false;
    }, { passive: false });
    window.addEventListener('blur', function () {
      for (var k in Input.down) Input.down[k] = false;
    });
  },
  isDown: function (a) { return !!this.down[a]; },
  pressed: function (a) { return !!this.just[a]; },
  /* 每帧开始：把累积的按下事件合并进 just（若上一帧没有逻辑步，边沿会保留） */
  beginFrame: function () {
    for (var k in this._queue) this.just[k] = true;
    this._queue = Object.create(null);
  },
  endStep: function () { this.just = Object.create(null); }
};

/* ==========================================================================
 * §5  摄像机（平滑跟随 / 边界夹取 / 震屏 / 高速轻微前倾 / 渲染插值）
 * ========================================================================== */
var Camera = {
  x: 0, y: 0, prevX: 0, prevY: 0,
  shake: 0, ox: 0, oy: 0, leanX: 0, leanY: 0,

  snapTo: function (target, level) {
    this.x = this.txVal(target, level, 'x');
    this.y = this.tyVal(target, level, 'y');
    this.prevX = this.x; this.prevY = this.y;
    this.leanX = this.leanY = 0;
    this.shake = 0; this.ox = this.oy = 0;
  },
  txVal: function (t, level, axis) {
    if (axis === 'x') return clamp(t.x + t.w / 2 - VW / 2, 0, Math.max(0, level.pxW - VW));
    return clamp(t.y + t.h / 2 - VH / 2 + 30, 0, Math.max(0, level.pxH - VH));
  },
  tyVal: function (t, level) {
    return clamp(t.y + t.h / 2 - VH / 2 + 30, 0, Math.max(0, level.pxH - VH));
  },
  addShake: function (v) {
    this.shake = Math.min(CONFIG.CAMERA.SHAKE_MAX, this.shake + v);
  },
  update: function (dt, target, level) {
    var C = CONFIG.CAMERA;
    this.prevX = this.x; this.prevY = this.y;

    var gx = target.x + target.w / 2 + target.vx * C.LOOKAHEAD;
    var gy = target.y + target.h / 2 + 30;
    var tx = clamp(gx - VW / 2, 0, Math.max(0, level.pxW - VW));
    var ty = clamp(gy - VH / 2, 0, Math.max(0, level.pxH - VH));

    this.x = lerp(this.x, tx, 1 - Math.exp(-C.SMOOTH * dt));
    this.y = lerp(this.y, ty, 1 - Math.exp(-C.SMOOTH * 0.7 * dt));
    this.x = clamp(this.x, 0, Math.max(0, level.pxW - VW));
    this.y = clamp(this.y, 0, Math.max(0, level.pxH - VH));

    this.leanX = clamp(target.vx * C.LEAN, -C.LEAN_MAX, C.LEAN_MAX);
    this.leanY = clamp(target.vy * C.LEAN * 0.6, -C.LEAN_MAX, C.LEAN_MAX);

    if (this.shake > 0) {
      this.shake = Math.max(0, this.shake - C.SHAKE_DECAY * dt * (this.shake + 1));
      this.ox = rand(-this.shake, this.shake);
      this.oy = rand(-this.shake, this.shake);
    } else {
      this.ox = this.oy = 0;
    }
  },
  renderX: function (a) { return Math.round(lerp(this.prevX, this.x, a) + this.leanX + this.ox); },
  renderY: function (a) { return Math.round(lerp(this.prevY, this.y, a) + this.leanY + this.oy); }
};

/* ==========================================================================
 * §6  粒子系统（对象池 + 环形覆盖，禁止运行时 new）
 * ========================================================================== */
function Particles(max) {
  this.max = max;
  this.i = 0;
  this.pool = [];
  for (var k = 0; k < max; k++) {
    this.pool.push({
      alive: false, kind: 'spark',
      x: 0, y: 0, vx: 0, vy: 0,
      life: 0, max: 1, size: 2, color: PAL.CYAN,
      grav: 0, drag: 0, rot: 0, vr: 0
    });
  }
}
Particles.prototype.spawn = function (o) {
  var p = this.pool[this.i];
  this.i = (this.i + 1) % this.max;
  p.alive = true;
  p.kind = o.kind || 'spark';
  p.x = o.x; p.y = o.y;
  p.vx = o.vx || 0; p.vy = o.vy || 0;
  p.life = p.max = o.life || 0.5;
  p.size = o.size || 2;
  p.color = o.color || PAL.CYAN;
  p.grav = o.grav || 0;
  p.drag = o.drag || 0;
  p.rot = o.rot || 0; p.vr = o.vr || 0;
  return p;
};
Particles.prototype.update = function (dt) {
  for (var i = 0; i < this.max; i++) {
    var p = this.pool[i];
    if (!p.alive) continue;
    p.life -= dt;
    if (p.life <= 0) { p.alive = false; continue; }
    p.vy += p.grav * dt;
    if (p.drag) { var d = Math.exp(-p.drag * dt); p.vx *= d; p.vy *= d; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
  }
};
Particles.prototype.draw = function (ctx) {
  for (var i = 0; i < this.max; i++) {
    var p = this.pool[i];
    if (!p.alive) continue;
    var a = p.life / p.max;
    if (p.kind === 'dust') {
      ctx.globalAlpha = a * 0.45;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (1.7 - a * 0.7), 0, 6.2832);
      ctx.fill();
      ctx.globalAlpha = 1;
    } else if (p.kind === 'ring') {
      ctx.globalAlpha = a * 0.75;
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (1 - a) * 3 + 4, 0, 6.2832);
      ctx.stroke();
      ctx.globalAlpha = 1;
    } else {
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
      ctx.globalAlpha = 1;
      GFX.drawGlow(ctx, p.color, p.x, p.y, p.size * 3, a * 0.6);
    }
  }
};
