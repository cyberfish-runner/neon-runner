  /* ---- F3：调试模式 ---- */
  /* 动态平台状态文字 */
  platState: function (q) {
    if (q.oneWay) {                       // 全息闪烁平台
      var B = CONFIG.BLINK, left;
      if (q.solid) left = (q.warn ? (B.ON + B.WARN) : B.ON) - q.t;
      else left = q.period - q.t;
      return (q.solid ? (q.warn ? '预警' : '实体') : '消失') + ' 剩 ' + left.toFixed(1) + 's';
    }
    return q.axis === 'x' ? '水平 range=' + Math.round(q.range / TILE) + '格 speed=' + q.speed
                          : '垂直 range=' + Math.round(q.range / TILE) + '格 speed=' + q.speed;
  },
  drawZone: function (ctx, w, camX, camY) {
    var p = w.player, L = w.level;
    var pc = Math.floor((p.x + p.w / 2) / TILE);
    var pr = Math.floor((p.y + p.h - 1) / TILE);

    /* 1) 瓦片网格线（世界空间） */
    ctx.save();
    ctx.translate(-camX, -camY);
    ctx.lineWidth = 1;
    var c0 = Math.floor(camX / TILE), c1 = Math.floor((camX + VW) / TILE);
    var r0 = Math.floor(camY / TILE), r1 = Math.floor((camY + VH) / TILE);
    for (var c = c0; c <= c1; c++) {
      ctx.strokeStyle = (c % 5 === 0) ? 'rgba(0,240,255,0.30)' : 'rgba(0,240,255,0.09)';
      ctx.beginPath(); ctx.moveTo(c * TILE + 0.5, r0 * TILE); ctx.lineTo(c * TILE + 0.5, (r1 + 1) * TILE); ctx.stroke();
    }
    for (var r = r0; r <= r1; r++) {
      ctx.strokeStyle = (r % 5 === 0) ? 'rgba(0,240,255,0.30)' : 'rgba(0,240,255,0.09)';
      ctx.beginPath(); ctx.moveTo(c0 * TILE, r * TILE + 0.5); ctx.lineTo((c1 + 1) * TILE, r * TILE + 0.5); ctx.stroke();
    }
    /* 玩家所在格高亮 */
    ctx.strokeStyle = 'rgba(255,45,149,0.95)';
    ctx.lineWidth = 1.6;
    ctx.strokeRect(pc * TILE + 0.5, pr * TILE + 0.5, TILE - 1, TILE - 1);

    /* 2) 附近动态平台：逐个框出 + 标号（与文字面板一一对应） */
    var near = [];
    var px = p.x + p.w / 2, py = p.y + p.h / 2;
    for (var i = 0; i < w.plats.length; i++) {
      var q = w.plats[i];
      var dx = (q.x + q.w / 2) - px, dy = (q.y + q.h / 2) - py;
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > 470) continue;
      near.push({ q: q, dist: dist });
    }
    near.sort(function (a, b) { return a.dist - b.dist; });
    for (var k = 0; k < near.length; k++) {
      var q2 = near[k].q;
      ctx.strokeStyle = q2.oneWay ? 'rgba(0,240,255,0.95)' : 'rgba(255,220,0,0.95)';
      ctx.lineWidth = 1.6;
      ctx.strokeRect(q2.x + 0.5, q2.y + 0.5, q2.w - 1, q2.h - 1);
      /* 运动轨迹 / 平台中心十字 */
      ctx.beginPath();
      ctx.moveTo(q2.x + q2.w / 2 - 4, q2.y + q2.h / 2);
      ctx.lineTo(q2.x + q2.w / 2 + 4, q2.y + q2.h / 2);
      ctx.moveTo(q2.x + q2.w / 2, q2.y + q2.h / 2 - 4);
      ctx.lineTo(q2.x + q2.w / 2, q2.y + q2.h / 2 + 4);
      ctx.stroke();
      ctx.font = 'bold 11px ' + FONT;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillStyle = 'rgba(5,8,20,0.85)';
      ctx.fillRect(q2.x + q2.w / 2 - 8, q2.y - 16, 16, 13);
      ctx.fillStyle = q2.oneWay ? Theme.primary : PAL.YELLOW;
      ctx.fillText('#' + (k + 1), q2.x + q2.w / 2, q2.y - 4);
    }
    /* 玩家像素坐标十字 */
    ctx.strokeStyle = 'rgba(255,60,120,0.9)';
    ctx.beginPath();
    ctx.moveTo(px - 8, py); ctx.lineTo(px + 8, py);
    ctx.moveTo(px, py - 8); ctx.lineTo(px, py + 8);
    ctx.stroke();
    ctx.restore();

    /* 3) 刻度标尺（屏幕空间，固定在画面边缘） */
    ctx.save();
    ctx.font = '10px ' + FONT;
    ctx.textBaseline = 'top';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(0,240,255,0.8)';
    for (var c3 = Math.ceil(camX / TILE); c3 * TILE < camX + VW; c3++) {
      if (c3 % 5 !== 0) continue;
      var sx = c3 * TILE - camX;
      if (sx < 12 || sx > VW - 12) continue;
      ctx.fillText(c3, sx, 34);
    }
    ctx.textAlign = 'left';
    for (var r3 = Math.ceil(camY / TILE); r3 * TILE < camY + VH; r3++) {
      if (r3 % 5 !== 0) continue;
      var sy = r3 * TILE - camY;
      if (sy < 40 || sy > VH - 12) continue;
      ctx.fillText(r3, 4, sy + 2);
    }
    ctx.restore();

    /* 4) 区域编号（地图数据里的 zones） */
    var z = L.zoneAt ? L.zoneAt(pc, pr) : null;
    var zs = (L.def && L.def.zones) || [];
    ctx.save();
    for (var zi = 0; zi < zs.length; zi++) {
      var q3 = zs[zi];
      var zx0, zx1, zy0, zy1;
      if (q3.c0 != null) { zx0 = q3.c0 * TILE; zx1 = (q3.c1 + 1) * TILE; zy0 = 0; zy1 = L.pxH; }
      else { zx0 = 0; zx1 = L.pxW; zy0 = q3.r0 * TILE; zy1 = (q3.r1 + 1) * TILE; }
      if (zx1 - camX < 0 || zx0 - camX > VW || zy1 - camY < 0 || zy0 - camY > VH) continue;
      var act = (z === q3);
      ctx.strokeStyle = act ? 'rgba(234,255,77,0.95)' : 'rgba(176,38,255,0.35)';
      ctx.lineWidth = act ? 2 : 1;
      ctx.setLineDash(act ? [] : [8, 8]);
      ctx.strokeRect(zx0 - camX + 0.5, zy0 - camY + 0.5, zx1 - zx0 - 1, zy1 - zy0 - 1);
      ctx.setLineDash([]);
      /* 区域标签：贴在区域带的可视范围内，纵向取该带中心（避开顶部 HUD 与右侧面板），
       * 横向做钳制，保证标签完整留在画面内 */
      ctx.font = 'bold 13px ' + FONT;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      var label = q3.id + ' ' + q3.name;
      var lw = ctx.measureText(label).width + 8;
      var lx = Math.max(zx0 - camX, 28) + 4;
      if (lx + lw > VW - 6) lx = VW - 6 - lw;
      if (lx < 4) lx = 4;
      var ly = clamp((zy0 + zy1) / 2 - camY - 9, 44, VH - 26);
      ctx.fillStyle = 'rgba(5,8,20,0.8)';
      ctx.fillRect(lx - 3, ly - 2, lw, 18);
      ctx.fillStyle = act ? '#eaff4d' : 'rgba(200,150,255,0.75)';
      ctx.fillText(label, lx + 1, ly);
    }
    ctx.restore();

    /* 5) 文字面板（放在右侧，避免和左侧区域标签重叠） */
    var gx = 452, gy = 54;
    var lines = [];
    lines.push(['等级  ', L.def.code + ' ' + L.def.name + '   ' + L.cols + ' x ' + L.rows + ' 格']);
    lines.push(['区域  ', z ? (z.id + ' ' + z.name + (z.c0 != null
      ? '   cols ' + z.c0 + '-' + z.c1 : '   rows ' + z.r0 + '-' + z.r1)) : '（未定义）']);
    lines.push(['玩家  ', 'x=' + p.x.toFixed(1) + ' y=' + p.y.toFixed(1) +
      '   格(' + pc + ',' + pr + ')   vx=' + p.vx.toFixed(0) + ' vy=' + p.vy.toFixed(0) +
      (p.onGround ? '  地面' : '  空中') + (p.ride ? ' (承载)' : '')]);
    lines.push(['跳跃  ', '二段跳 ' + (p.onGround ? '就绪' : (p.airJumps < CONFIG.PLAYER.AIR_JUMPS ? '就绪' : '已用')) +
      '  冲刺 ' + (p.dashCd <= 0 ? '就绪' : p.dashCd.toFixed(1) + 's') +
      '  无敌 ' + (p.invuln > 0 ? p.invuln.toFixed(1) + 's' : '-')]);
    lines.push(['平台  ', '附近 ' + near.length + ' 个 / 全关 ' + w.plats.length + ' 个']);
    for (var m = 0; m < Math.min(near.length, 5); m++) {
      var q4 = near[m].q;
      lines.push(['  #' + (m + 1) + (q4.oneWay ? ' %' : (q4.axis === 'x' ? ' H' : ' V')),
        'x=' + q4.x.toFixed(0) + ' y=' + q4.y.toFixed(0) + '  ' + q4.w + 'x' + q4.h +
        '   格(' + Math.floor(q4.x / TILE) + ',' + Math.floor(q4.y / TILE) + ')  ' + this.platState(q4)]);
    }
    var bw = 494, bh = 18 * lines.length + 14;
    ctx.save();
    ctx.fillStyle = 'rgba(5,8,20,0.82)';
    ctx.fillRect(gx - 6, gy - 6, bw, bh);
    ctx.strokeStyle = 'rgba(234,255,77,0.55)';
    ctx.lineWidth = 1;
    ctx.strokeRect(gx - 5.5, gy - 5.5, bw - 1, bh - 1);
    for (var n = 0; n < lines.length; n++) {
      var yy = gy + n * 18;
      glowText(ctx, lines[n][0], gx, yy, PAL.YELLOW, 'left', 12);
      glowText(ctx, lines[n][1], gx + 52, yy, '#eaffff', 'left', 12);
    }
    glowText(ctx, 'DEBUG F3（调试模式）· F2 碰撞盒 · FPS ' + Game.fps.toFixed(0),
      gx, gy + bh + 2, rgba(PAL.YELLOW, 0.8), 'left', 11);
    ctx.restore();
  }
};

    movePlats: [
      { c: 36, r: 25, axis: 'y', range: 3, speed: 60, phase: 0 },
      { c: 4, r: 10, axis: 'y', range: 5, speed: 62, phase: 0.5 },
    ],
    bots: [
      { c: 24, r: 50, minC: 22, maxC: 28 },
    ],
    blinks: [
    ]
  }
];





/* ==========================================================================
 * §19  Game —— 状态机 + 主循环 + 缩放适配
 *   状态：title（标题） / help（操作说明） / playing（游戏中）
 *         paused（暂停） / clear（过关结算） / gameover（游戏结束）
 * ========================================================================== */
var Game = {
  canvas: null, ctx: null,
  world: null, levelIdx: 0,
  state: 'title', stateT: 0,
  menu: new MenuScreen(),
  result: null, newRecord: false, runScore: 0,
  runTotal: { chips: 0, time: 0, levels: 0, scores: 0 },
  endingLines: [], endingScroll: 0, endingLength: 0, endingDone: false,
  acc: 0, last: 0, elapsed: 0, levelElapsed: 0, fps: 60,
  titleCam: 0,
  lowGfx: false, _slowFrames: 0, _fpsAcc: 0, _fpsN: 0,

  init: function () {
    this.canvas = document.getElementById('game');
    this.ctx = this.canvas.getContext('2d');
    Input.init();
    Mouse.init(this.canvas);
    Save.load();
    Background.init();
    Rain.init();
    PostFX.init();
    /* 先在幕后装载第 0 关，让标题背景就是真实关卡画面 */
    this.loadLevel(0, true);
    this.gotoTitle();
    this.resize();
    window.addEventListener('resize', function () { Game.resize(); });
    this.last = performance.now();
    this.stateT = this.last;
    var tick = function (now) {
      Game.frame(now);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  },

  /* silent=true 时只装载关卡，不改变状态机 */
  loadLevel: function (idx, silent) {
    this.levelIdx = clamp(idx, 0, LEVELS.length - 1);
    var def = LEVELS[this.levelIdx];
    Theme = THEMES[def.theme] || THEMES.cyan;
    Background.rebuild();
    this.world = new World(def);
    Camera.snapTo(this.world.player, this.world.level);
    this.acc = 0;
    this.levelElapsed = 0;
    this.runScore = 0;                 // 每关单独计分，累计在结算时叠加
    HUD_HINT_RESET();
    if (!silent) {
      this.state = 'playing';
      this.stateT = performance.now();
    }
  },

  /* 开始一整轮游戏（从指定关卡起） */
  startRun: function (idx) {
    this.runScore = 0;
    this.runTotal = { chips: 0, time: 0, levels: 0, scores: 0 };
    this.loadLevel(idx, false);
    AudioBus.play('uiConfirm');
  },

  gotoTitle: function () {
    Theme = THEMES[LEVELS[this.levelIdx].theme] || THEMES.cyan;
    Background.rebuild();
    this.state = 'title';
    this.stateT = performance.now();
    Screens.buildTitle(this);
  },

  enterPause: function () {
    this.state = 'paused';
    this.stateT = performance.now();
    Screens.buildPause(this);
    AudioBus.play('uiConfirm');
  },
  resumeFromPause: function () {
    this.state = 'playing';
    this.stateT = performance.now();
    AudioBus.play('uiConfirm');
  },
  enterClear: function () {
    var res = buildResult(this.world);
    this.runScore += res.score;
    this.runTotal.chips += res.chips;
    this.runTotal.time += res.time;
    this.runTotal.levels++;
    this.runTotal.scores += res.score;
    if (this.levelIdx === 0) this.runTotal.totalChipsL1 = this.world.totalChips;
    this.newRecord = Save.record(this.levelIdx, res);
    this.result = res;
    this.state = 'clear';
    this.stateT = performance.now();
    Screens.buildClear(this, res, this.levelIdx >= LEVELS.length - 1);
    AudioBus.play('clear', res);
  },
  enterGameOver: function () {
    this.state = 'gameover';
    this.stateT = performance.now();
    Screens.buildGameOver(this);
    AudioBus.play('gameOver');
  },
  /* 结局：制作名单式滚动文字 */
  enterEnding: function () {
    var t = this.runTotal;
    var full = Save.clearedCount() >= LEVELS.length;
    var lines = [
      { text: 'NEON RUNNER', big: true, size: 46, color: Theme.primary, gap: 46 },
      { text: '霓 虹 跑 者', big: true, size: 18, color: Theme.secondary, gap: 60 },
      { text: '一个关于数据、雨夜与霓虹的短途奔跑', color: rgba(Theme.primary, 0.8), gap: 52 },
      { text: '— 本次数据 —', color: Theme.secondary, gap: 38 },
      { text: '总芯片   ' + t.chips + ' 枚', color: '#eaff4d', gap: 26 },
      { text: '总用时   ' + fmtTime(t.time), color: '#eaff4d', gap: 26 },
      { text: '总得分   ' + String(this.runScore).padStart(6, '0'), color: '#eaff4d', gap: 26 },
      { text: '通过关卡 ' + t.levels + ' / ' + LEVELS.length, color: '#eaff4d', gap: 52 },
      { text: '— 关卡记录 —', color: Theme.secondary, gap: 38 }
    ];
    for (var i = 0; i < LEVELS.length; i++) {
      var b = Save.bestOf(i);
      lines.push({
        text: LEVELS[i].code + ' ' + LEVELS[i].name + '   ' +
          (b ? (b.rank + '  ' + b.chips + '/' + b.total + '  ' + fmtTime(b.time)) : '-- 未通过 --'),
        color: b ? RANK_COLOR[b.rank] : 'rgba(120,140,180,0.6)', gap: 26
      });
    }
    lines.push({ text: '累计最高分  ' + String(Save.totalBestScore()).padStart(6, '0'), color: '#eaff4d', gap: 52 });
    lines.push({ text: '— CREDITS —', color: Theme.secondary, gap: 38 });
    lines.push({ text: '设计 / 程序 / 美术   Canvas 2D 程序化绘制', gap: 24 });
    lines.push({ text: '引擎   原生 JavaScript（ES6+）单文件 · 无依赖', gap: 24 });
    lines.push({ text: '物理   分轴 AABB 扫掠 + 子步 + 脚底探针', gap: 24 });
    lines.push({ text: '特效   离屏辉光缓存 / 对象池粒子 / 视差烘焙', gap: 24 });
    lines.push({ text: '手感   土狼时间 0.10s · 跳跃缓冲 0.10s · 冲刺 1.0s', gap: 24 });
    lines.push({ text: '存 档  localStorage · ' + (Save.available ? '已挂载' : '本次会话内存'), gap: 24 });
    lines.push({ text: '音 效  AudioBus 接口已预留（本阶段无音频）', gap: 52 });
    if (full) {
      lines.push({ text: 'TOTAL COMPLETE', big: true, size: 34, color: '#eaff4d', gap: 40 });
      lines.push({ text: '全部关卡已通过 · 感谢游玩', color: Theme.primary, gap: 60 });
    } else {
      lines.push({ text: 'TO BE CONTINUED', big: true, size: 26, color: Theme.primary, gap: 46 });
      lines.push({ text: '仍有未通过的关卡', color: rgba(Theme.primary, 0.7), gap: 60 });
    }
    lines.push({ text: '◆ END ◆', color: Theme.secondary, gap: 80 });

    this.endingLines = lines;
    var total = 0;
    for (var k = 0; k < lines.length; k++) total += lines[k].gap || 26;
    this.endingLength = total + 120;
    this.endingScroll = 0;
    this.endingDone = false;
    this.state = 'ending';
    this.stateT = performance.now();
    AudioBus.play('clear');
  },

  frame: function (now) {
    var dt = (now - this.last) / 1000;
    this.last = now;
    if (!isFinite(dt) || dt < 0) dt = 0;
    dt = Math.min(dt, CONFIG.VIEW.MAX_DT);

    var STEP = CONFIG.VIEW.STEP;
    this.acc += dt;
    Input.beginFrame();
    var n = 0;
    while (this.acc >= STEP && n < 5) {
      this.step(STEP);
      Input.endStep();
      this.acc -= STEP;
      n++;
    }
    /* n===5：追帧上限，丢弃剩余时间；acc<0：切关时 loadLevel 清零后被本帧减成负数，
     * 必须夹回 0，否则下一帧会跑 0 个逻辑步、吞掉一帧输入 */
    if (n === 5 || this.acc < 0) this.acc = 0;

    this.render(this.acc / STEP);
    this.perf(dt);
  },

  step: function (dt) {
    var w = this.world;
    this.elapsed += dt;

    /* 全局画质 / 调试开关（任何状态可用） */
    if (Input.pressed('fxRain')) CONFIG.FX.RAIN = !CONFIG.FX.RAIN;
    if (Input.pressed('fxDust')) CONFIG.FX.DUST = !CONFIG.FX.DUST;
    if (Input.pressed('fxGlow')) CONFIG.FX.GLOW = !CONFIG.FX.GLOW;
    if (Input.pressed('debug')) Debug.on = !Debug.on;
    if (Input.pressed('debugZone')) Debug.zone = !Debug.zone;   // F3 调试模式（默认关闭）

    switch (this.state) {
      case 'title':
        Background.update(dt, 0);
        Rain.update(dt, 0);
        this.titleCam += dt * 26;
        var pick = Game.menu.update();
        if (pick === 'continue') this.startRun(Save.nextUncleared());
        else if (pick === 'new') this.startRun(0);
        else if (pick === 'help') { this.state = 'help'; this.stateT = performance.now(); }
        else if (pick === 'wipe') { Save.reset(); Screens.buildTitle(this); }
        break;

      case 'help':
        Background.update(dt, 0);
        Rain.update(dt, 0);
        if (Input.pressed('pause') || Input.pressed('confirm') || Input.pressed('jump') || Mouse.consumeClick()) {
          this.gotoTitle();
        }
        break;

      case 'playing':
        this.levelElapsed += dt;
        if (Input.pressed('pause')) { this.enterPause(); break; }
        if (Input.pressed('restart')) {
          var keep = this.runScore;
          this.loadLevel(this.levelIdx, false);
          this.runScore = keep;
          break;
        }
        var prevCamX = Camera.x;
        w.update(dt);
        if (w.state === 'clear') { this.enterClear(); break; }
        if (w.state === 'gameover') { this.enterGameOver(); break; }
        Camera.update(dt, w.player, w.level);
        Background.update(dt, Camera.x - prevCamX);
        Rain.update(dt, Camera.x - prevCamX);
        break;

      case 'paused':
        var p = this.menu.update();
        if (Input.pressed('pause')) { this.resumeFromPause(); break; }
        if (Input.pressed('restart')) {
          var keep2 = this.runScore;
          this.loadLevel(this.levelIdx, false);
          this.runScore = keep2;
          break;
        }
        if (p === 'resume') this.resumeFromPause();
        else if (p === 'replay') this.loadLevel(this.levelIdx, false);
        else if (p === 'title') this.gotoTitle();
        break;

      case 'clear':
        w.fx.update(dt);
        Background.update(dt, 0);
        Rain.update(dt, 0);
        var cp = this.menu.update();
        if (cp === 'next') this.startRun(clamp(this.levelIdx + 1, 0, LEVELS.length - 1));
        else if (cp === 'ending') this.enterEnding();
        else if (cp === 'replay') this.loadLevel(this.levelIdx, false);
        else if (cp === 'title') this.gotoTitle();
        break;

      case 'ending':
        /* 制作名单滚动：到底后停住，任意确认键返回标题 */
        if (!this.endingDone) {
          this.endingScroll += dt * (this.endingFast ? 150 : 62);
          if (this.endingScroll >= this.endingLength) {
            this.endingScroll = this.endingLength;
            this.endingDone = true;
          }
          if (Input.down.jump || Input.down.confirm) this.endingFast = true;
          else this.endingFast = false;
          Rain.update(dt, 0);
        }
        if (Input.pressed('pause') || Input.pressed('confirm') || Input.pressed('jump') || Mouse.consumeClick()) {
          if (this.endingDone || Input.pressed('pause')) this.gotoTitle();
          else { this.endingScroll = this.endingLength; this.endingDone = true; }
        }
        break;

      case 'gameover':
        w.fx.update(dt);
        Background.update(dt, 0);
        Rain.update(dt, 0);
        var gp = this.menu.update();
        if (gp === 'retry') this.loadLevel(this.levelIdx, false);
        else if (gp === 'title') this.gotoTitle();
        else if (Input.pressed('pause')) this.gotoTitle();
        break;
    }
  },

  render: function (alpha) {
    var ctx = this.ctx, w = this.world;
    var camX, camY;
    if (this.state === 'title' || this.state === 'help') {
      camX = Math.round(this.titleCam) % Math.max(1, w.level.pxW - VW || 1);
      camY = 0;
    } else {
      camX = Camera.renderX(alpha);
      camY = Camera.renderY(alpha);
    }
    Camera.rx = camX; Camera.ry = camY;

    Background.draw(ctx, camX, camY);
    ctx.save();
    ctx.translate(-camX, -camY);
    w.drawWorld(ctx, alpha);
    ctx.restore();
    Rain.draw(ctx);

    if (w.flash > 0) {
      ctx.fillStyle = rgba(PAL.DANGER, 0.28 * clamp(w.flash, 0, 1));
      ctx.fillRect(0, 0, VW, VH);
    }
    PostFX.draw(ctx);

    var fade = clamp((performance.now() - this.stateT) / 220, 0, 1);
    switch (this.state) {
      case 'title':
        Screens.drawTitle(ctx, this, fade);
        break;
      case 'help':
        Screens.drawHelp(ctx, fade);
        break;
      case 'playing':
        HUD.draw(ctx, this, w);
        break;
      case 'paused':
        HUD.draw(ctx, this, w);
        Screens.drawPause(ctx, this, fade);
        break;
      case 'clear':
        HUD.draw(ctx, this, w);
        Screens.drawClear(ctx, this, fade);
        break;
      case 'gameover':
        HUD.draw(ctx, this, w);
        Screens.drawGameOver(ctx, this, fade);
        break;
      case 'ending':
        Screens.drawEnding(ctx, this, fade);
        break;
    }
    if (Debug.on && this.state !== 'title' && this.state !== 'help') {
      Debug.draw(ctx, w, camX, camY);
    }
    /* F3 调试模式：网格 / 坐标 / 区域编号 / 附近平台坐标（正式版默认关闭） */
    if (Debug.zone && this.state !== 'title' && this.state !== 'help') {
      Debug.drawZone(ctx, w, camX, camY);
    }
  },

  resize: function () {
    var dpr = Math.min(window.devicePixelRatio || 1, CONFIG.VIEW.DPR_MAX);
    this.canvas.width = Math.round(VW * dpr);
    this.canvas.height = Math.round(VH * dpr);
    var scale = Math.min(window.innerWidth / VW, window.innerHeight / VH);
    this.canvas.style.width = Math.floor(VW * scale) + 'px';
    this.canvas.style.height = Math.floor(VH * scale) + 'px';
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.ctx.imageSmoothingEnabled = true;
  },

  perf: function (dt) {
    if (dt > 0) {
      this._fpsAcc += dt; this._fpsN++;
      if (this._fpsAcc >= 0.5) {
        this.fps = this._fpsN / this._fpsAcc;
        this._fpsAcc = 0; this._fpsN = 0;
      }
    }
    if (dt > CONFIG.RENDER.LOW_MS / 1000) {
      this._slowFrames++;
      if (this._slowFrames > CONFIG.RENDER.LOW_FRAMES && !this.lowGfx) {
        this.lowGfx = true;
        CONFIG.FX.GLOW = false;
        CONFIG.FX.RAIN = false;
      }
    } else {
      this._slowFrames = Math.max(0, this._slowFrames - 1);
    }
  }
};

/* 进入新关卡时重置“操作提示淡出”计时 */
function HUD_HINT_RESET() { Game.levelElapsed = 0; }

/* 摄像机渲染坐标缓存（供 Level.draw / Debug 使用） */
Camera.rx = 0;
Camera.ry = 0;

/* 启动 */
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', function () { Game.init(); });
} else {
  Game.init();
}

/* 暴露到全局，方便在控制台调参调试：CP.CONFIG.PLAYER.JUMP_VEL = 700 等 */
window.CP = {
  CONFIG: CONFIG, PAL: PAL, THEMES: THEMES, LEVELS: LEVELS,
  Game: Game, Camera: Camera, GFX: GFX, Input: Input, Save: Save,
  Debug: Debug, World: World,
  rankOf: rankOf, scoreOf: scoreOf,
  get Theme() { return Theme; }
};

})();
</script>
